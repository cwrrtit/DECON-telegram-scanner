<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner App Interface</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --row-border: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-blue: #007aff;
            --duplicate-blue: #0a84ff;
            --add-green: #30d158;
            --lock-duration: 490ms;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Mock Scanner Bounding Box Area */
        .scanner-container {
            width: 100%;
            max-width: 360px;
            height: 180px;
            border: 2px dashed #444;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
        }

        .scanner-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            background: #2c2c2e;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        button:active {
            opacity: 0.7;
        }

        /* Pop-up Card */
        .popup-card {
            width: 100%;
            max-width: 360px;
            background-color: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2c2c2e;
        }

        /* Header */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--row-border);
        }

        .header-title-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .btn-edit {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Scrollable List Area */
        .list-container {
            max-height: 220px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* List Rows */
        .list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--row-border);
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: background-color var(--lock-duration) ease;
        }

        .list-row:last-child {
            border-bottom: none;
        }

        /* Blue Flash Keyframe Animation (Same dynamics as add-green) */
        @keyframes flashBlueAnimation {
            0% { background-color: transparent; }
            30% { background-color: rgba(10, 132, 255, 0.4); }
            100% { background-color: transparent; }
        }

        .flash-blue {
            animation: flashBlueAnimation var(--lock-duration) ease-in-out;
        }

        /* Custom SVGs for Lock / Unlock */
        .icon-btn {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: #8e8e93;
            transition: transform var(--lock-duration) cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn:active .icon-svg {
            transform: scale(0.9);
        }

        /* Copy icon standard styling */
        .copy-icon {
            width: 18px;
            height: 18px;
            fill: #8e8e93;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Scanner Bounding Box Display -->
    <div class="scanner-container">
        <span style="font-size: 12px; color: #8e8e93; margin-bottom: 12px;">Scanner Bounding Box Viewport</span>
        <div class="scanner-controls">
            <button onclick="simulateScan('DMP-12')">Scan DMP-12 (Duplicate Lock)</button>
            <button onclick="simulateScan('MID 21634')">Scan MID 21634 (Duplicate Lock)</button>
        </div>
    </div>

    <!-- Main Popup Window -->
    <div class="popup-card">
        <div class="card-header">
            <div class="header-title-container">
                <!-- Cleanly sitting brackets with no spaces: TOTAL (X) -->
                <span class="header-title" id="total-count-text">TOTAL (1)</span>
                
                <!-- Duplicate / Copy Icon -->
                <svg class="copy-icon" viewBox="0 0 24 24">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
            </div>
            <button class="btn-edit">Edit</button>
        </div>

        <div class="list-container" id="list-container">
            <!-- Row 1 -->
            <div class="list-row" id="row-DMP-12" data-code="DMP-12">
                <span class="item-label">DMP-12 (1)</span>
                <button class="icon-btn" onclick="toggleLock(this)" data-locked="true" aria-label="Toggle Lock">
                    <!-- Updated Lock Icon (Reference 4 Exact Style) -->
                    <svg class="icon-svg lock-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </button>
            </div>

            <!-- Row 2 -->
            <div class="list-row" id="row-MID 21634" data-code="MID 21634">
                <span class="item-label">MID 21634</span>
                <button class="icon-btn" onclick="toggleLock(this)" data-locked="true" aria-label="Toggle Lock">
                    <!-- Updated Lock Icon (Reference 4 Exact Style) -->
                    <svg class="icon-svg lock-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // SVG Definitions
        const LOCK_SVG = `<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>`;
        const UNLOCK_SVG = `<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>`;

        // Haptic Feedback Helper
        function triggerHaptic(type) {
            if (!navigator.vibrate) return;

            if (type === 'heavy-single') {
                // Heavy Single Haptic (Locking)
                navigator.vibrate(60);
            } else if (type === 'heavy-double') {
                // Heavy Double Haptic (Unlocking)
                navigator.vibrate([50, 40, 50]);
            } else if (type === 'faceid-rejected') {
                // Face-ID Wrong Face / Rejected Haptic Pattern
                navigator.vibrate([70, 50, 65, 50, 75]);
            }
        }

        // Lock / Unlock Toggle Function with 490ms duration feel
        function toggleLock(buttonEl) {
            const isLocked = buttonEl.getAttribute('data-locked') === 'true';
            const svgEl = buttonEl.querySelector('.icon-svg');

            if (isLocked) {
                // Unlock Action
                buttonEl.setAttribute('data-locked', 'false');
                svgEl.innerHTML = UNLOCK_SVG;
                triggerHaptic('heavy-double');
            } else {
                // Lock Action
                buttonEl.setAttribute('data-locked', 'true');
                svgEl.innerHTML = LOCK_SVG;
                triggerHaptic('heavy-single');
            }
        }

        // Dynamically Update Total Header Title Formatting without inner spaces
        function updateTotalCount(count) {
            const totalTextEl = document.getElementById('total-count-text');
            totalTextEl.textContent = `TOTAL (${count})`;
        }

        // Simulate Scanning Duplicate Encrypted or Raw Code
        function simulateScan(code) {
            const targetRow = document.getElementById(`row-${code}`);
            if (!targetRow) return;

            const lockBtn = targetRow.querySelector('.icon-btn');
            const isLocked = lockBtn.getAttribute('data-locked') === 'true';

            if (isLocked) {
                // 1. Immediately autoscroll to bring locked row into view
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                // 2. Flash duplicate blue color using same animation curve & duration
                targetRow.classList.remove('flash-blue');
                // Force Reflow
                void targetRow.offsetWidth;
                targetRow.classList.add('flash-blue');

                // 3. Trigger heavy Face-ID rejection haptic
                triggerHaptic('faceid-rejected');
            }
        }
    </script>
</body>
</html>
