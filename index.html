<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --tg-safe-top: 56px;
      --tg-safe-bottom: 24px;
      --app-corner-radius: 16px;
      --button-corner-radius: 12px;
      --status-red: #ff3b30;
      --status-amber: #f4cb11;
      --status-green: #00db62;
      --status-white: #ffffff;
      --status-idle-border: #3a3a3c;
      --ios-blue: #007aff;
      --ios-blue-pressed: #0062cc;
      --ios-blue-muted-duplicate: #004080;
      --copy-btn-bg: #2c2c2e;
      --copy-btn-icon: #d1d1d6;
      --copy-success-bg: #103B23;
      --copy-success-icon: #00db62;
    }
    
    * {
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: var(--tg-safe-top);
      padding-bottom: 0px;
      padding-left: 16px;
      padding-right: 16px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      transition: padding-top 0.2s ease-out;
    }

    .app-container.camera-stopped {
      padding-top: calc(var(--tg-safe-top) + 70px) !important;
    }

    #scanner-container {
      position: relative; 
      width: 100%;
      max-width: 100%;
      border-radius: var(--app-corner-radius);
      overflow: hidden;
      background: #000000;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    #interactive {
      width: 100% !important;
      height: auto !important;
    }

    #interactive video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    #interactive * {
      border: none !important;
      border-color: transparent !important;
    }

    #custom-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #custom-viewfinder {
      position: relative;
      box-sizing: border-box;
      width: 75vw; 
      height: 55vw; 
      max-width: 75%;
      max-height: 55%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      border-radius: 18px; 
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.05s ease;
    }

    /* iOS Error Shake Animation */
    @keyframes iosShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-9px); }
      40%, 80% { transform: translateX(9px); }
    }

    #custom-viewfinder.shake-error {
      animation: iosShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .scanner-corner {
      position: absolute;
      width: 36px; 
      height: 36px; 
      box-sizing: border-box;
      transition: border-color 0.3s ease, filter 0.3s ease;
    }

    .tl {
      top: -3px; left: -3px;
      border-top: 5px solid #ffffff !important;
      border-left: 5px solid #ffffff !important;
      border-right: none !important; 
      border-bottom: none !important;
      border-top-left-radius: 21px;
    }

    .tr {
      top: -3px; right: -3px;
      border-top: 5px solid #ffffff !important;
      border-right: 5px solid #ffffff !important;
      border-left: none !important; 
      border-bottom: none !important;
      border-top-right-radius: 21px;
    }

    .bl {
      bottom: -3px; left: -3px;
      border-bottom: 5px solid #ffffff !important;
      border-left: 5px solid #ffffff !important;
      border-right: none !important; 
      border-top: none !important;
      border-bottom-left-radius: 21px;
    }

    .br {
      bottom: -3px; right: -3px;
      border-bottom: 5px solid #ffffff !important;
      border-right: 5px solid #ffffff !important;
      border-left: none !important; 
      border-top: none !important;
      border-bottom-right-radius: 21px;
    }

    #custom-viewfinder.scan-success .scanner-corner {
      border-color: #00db62 !important; 
      filter: drop-shadow(0px 0px 4px rgba(1, 231, 40, 0.75));
    }

    #custom-viewfinder.scan-error .scanner-corner {
      border-color: #ff3b30 !important; 
      filter: drop-shadow(0px 0px 4px rgba(255, 59, 48, 0.75));
    }

    #custom-viewfinder.scan-duplicate-locked .scanner-corner {
      border-color: var(--ios-blue) !important;
      filter: drop-shadow(0px 0px 4px rgba(0, 122, 255, 0.75));
    }

    #log-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      margin-bottom: 0px;
      position: relative;
      overflow: hidden;
    }

    .log-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 6px 4px;
      flex-shrink: 0;
      height: 32px;
      position: relative;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h3 {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      color: #a2a2a7; 
      letter-spacing: 0.4px;
      font-weight: 600;
      line-height: 32px;
    }

    .saved-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #a2a2a7;
      letter-spacing: 0.4px;
      font-weight: 600;
      line-height: 32px;
    }

    .status-dots-group {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 16px;
      height: 32px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      box-sizing: border-box;
      background-color: transparent;
      border: 1px solid var(--status-idle-border);
      transition: background-color 0.15s ease-in-out, 
                  border-color 0.15s ease-in-out, 
                  box-shadow 0.15s ease-in-out;
    }

    .status-dot.active-white {
      background-color: var(--status-white);
      border-color: var(--status-white);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    .status-dot.active-green {
      background-color: var(--status-green);
      border-color: var(--status-green);
      box-shadow: 0 0 8px rgba(0, 219, 98, 0.6);
    }

    .status-dot.active-amber {
      background-color: var(--status-amber);
      border-color: var(--status-amber);
      box-shadow: 0 0 8px rgba(244, 203, 17, 0.6);
    }

    .status-dot.active-red {
      background-color: var(--status-red);
      border-color: var(--status-red);
      box-shadow: 0 0 8px rgba(255, 59, 48, 0.6);
    }

    .status-dot.active-blue {
      background-color: var(--ios-blue);
      border-color: var(--ios-blue);
      box-shadow: 0 0 8px rgba(0, 122, 255, 0.6);
    }

    .icon-action-btn {
      background-color: var(--copy-btn-bg);
      color: var(--copy-btn-icon);
      cursor: pointer;
      border: none;
      padding: 0 10px;
      min-width: 36px;
      height: 32px;
      border-radius: var(--button-corner-radius);
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.08s ease;
      box-sizing: border-box;
    }

    .icon-action-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--copy-btn-icon);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .icon-action-btn.copied {
      background-color: var(--copy-success-bg) !important;
    }

    .icon-action-btn.copied svg {
      stroke: var(--copy-success-icon) !important;
    }

    #scanned-list {
      list-style-type: none;
      padding: 0;
      padding-bottom: 90px !important;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #2c2c2e; 
      border-radius: var(--app-corner-radius);
      background-color: #000000;
      overflow-y: auto;
      flex-grow: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: none;
      position: relative;
      z-index: 1;
    }

    #scanned-list.has-items {
      display: block;
    }

    .list-category-header {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #1c1c1e;
      padding: 4px 18px;
      font-size: 12px;
      font-weight: 700;
      color: #a2a2a7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2c2c2e;
      margin: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .category-header-title {
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-modify: read-only;
    }

    .ios-lock-icon {
      width: 18px;
      height: 18px;
      fill: #a2a2a7;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      transition: opacity 0.4s ease, transform 0.2s ease;
    }

    .ios-lock-icon.fade-out {
      opacity: 0;
      transform: scale(0.8);
    }

    #scanned-list li {
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 400;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a0a;
      border-bottom: 1px solid #2c2c2e; 
      transition: background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.55s cubic-bezier(0.25, 1, 0.5, 1), 
                  opacity 0.45s ease, 
                  max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1), 
                  padding 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: background-color, transform, opacity, max-height;
      overflow: hidden;
      max-height: 60px;
    }

    #scanned-list li:last-child {
      border-bottom: none;
    }

    #scanned-list li span:first-child {
      color: #ffffff;
      display: flex;
      align-items: center;
    }

    .row-status-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
    }

    .row-locked {
      opacity: 0.55 !important;
    }

    @keyframes rowPulseGreen {
      0% {
        background-color: #009945;
      }
      100% {
        background-color: #0a0a0a;
      }
    }

    #scanned-list li.pulse-new-item {
      animation: rowPulseGreen 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    #scanned-list li.locked-duplicate-persistent {
      background-color: var(--ios-blue-muted-duplicate) !important;
      opacity: 1 !important;
      transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
    }

    #scanned-list li.unlocked-duplicate-persistent {
      background-color: var(--ios-blue-muted-duplicate) !important;
      opacity: 1 !important;
      transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
    }

    #scanned-list li.undo-target-glow {
      background-color: var(--status-red) !important;
    }

    #scanned-list li.undo-slide-out {
      background-color: var(--status-red) !important;
      transform: translateX(-105%);
      opacity: 0.2;
    }

    #scanned-list li.undo-collapse {
      max-height: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
      opacity: 0 !important;
    }

    .status-flash { 
      color: #00db62 !important; 
      font-weight: 500; 
      font-size: 15px; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTROL PANEL & ACTION BAR UI */
    #control-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: calc(var(--tg-safe-bottom) + 6px);
      padding-top: 20px;
      z-index: 20;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 50%, rgba(0,0,0,1) 100%);
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      height: 48px;
      pointer-events: auto;
    }

    /* Undo Button with Glass Gradient Stroke */
    .action-btn-undo {
      width: 54px;
      height: 48px;
      border-radius: 18px;
      background: #1c85ff;
      border: 1px solid transparent;
      border-image: linear-gradient(to bottom, #7ce7ff 0%, #004080 100%) 1;
      border-radius: 18px; /* Smooth rounded corners */
      background-clip: padding-box;
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      position: relative;
      transition: transform 0.08s ease, background-color 0.08s ease, opacity 0.08s ease;
      box-sizing: border-box;
    }

    /* Custom Gradient Border fallback for rounded edges */
    .action-btn-undo::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(to bottom, #7ce7ff 0%, #004080 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .action-btn-undo:active {
      transform: scale(0.92);
      background-color: #0062cc;
      opacity: 0.9;
    }

    .action-btn-undo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #7ce7ff;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
      z-index: 2;
    }

    /* Middle Pill Bar (Copy + Create) */
    .middle-bar {
      display: flex;
      align-items: center;
      flex-grow: 1;
      height: 48px;
      background: #242426;
      border-radius: 18px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .middle-bar.copy-active {
      background: #103B23;
      box-shadow: 0 0 12px rgba(0, 219, 98, 0.4);
    }

    .copy-hitbox {
      background: transparent;
      border: none;
      height: 100%;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease;
    }

    .copy-hitbox:active {
      transform: scale(0.92);
    }

    .copy-hitbox svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #d1d1d6;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .middle-bar.copy-active .copy-hitbox svg {
      stroke: #00db62 !important;
    }

    .create-btn-static {
      flex-grow: 1;
      height: 100%;
      background: #141416;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E1E1E1;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      user-select: none;
    }

    /* Done Button Wrapper & Button */
    .done-btn-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .done-btn {
      position: relative;
      z-index: 2;
      height: 48px;
      padding: 0 26px;
      background: #EAEAEA;
      color: #000000;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-sizing: border-box;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, background-color 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .done-btn:active {
      transform: scale(0.94);
      background-color: #d8d8d8;
    }

    /* MODAL STYLES */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 72vh;
      background: rgba(28, 28, 30, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--app-corner-radius);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.92);
      transition: transform 0.38s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      min-height: 44px;
      max-height: 44px;
      background: rgba(44, 44, 46, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-header h4 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #a2a2a7;
      font-weight: 700;
      height: 32px;
      line-height: 32px;
    }

    .header-actions {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 32px;
    }

    .edit-btn {
      position: absolute;
      right: 0;
      background: var(--ios-blue);
      border: none;
      color: #78fefb;
      padding: 0 14px;
      border-radius: var(--button-corner-radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transform: scale(1) translateX(0);
      transform-origin: right center;
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1), 
                  opacity 0.32s cubic-bezier(0.25, 1, 0.5, 1),
                  background-color 0.15s ease;
      pointer-events: auto;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .edit-btn:active {
      background-color: var(--ios-blue-pressed);
    }

    .edit-actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      opacity: 0;
      transform: scale(0.9) translateX(10px);
      transform-origin: right center;
      pointer-events: none;
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1), 
                  opacity 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .is-editing .edit-btn {
      opacity: 0;
      transform: scale(0.85) translateX(8px);
      pointer-events: none;
    }

    .is-editing .edit-actions-group {
      opacity: 1;
      transform: scale(1) translateX(0);
      pointer-events: auto;
    }

    .action-btn-cancel {
      background: #2c2c2e;
      border: none;
      color: #ffffff;
      padding: 0;
      width: 32px;
      height: 32px;
      border-radius: var(--button-corner-radius);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-sizing: border-box;
    }

    .action-btn-cancel:active {
      background: #3a3a3c;
      transform: scale(0.94);
    }

    .action-btn-cancel svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      display: block;
    }

    .action-btn-delete {
      border: none;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      height: 32px;
      border-radius: var(--button-corner-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-sizing: border-box;
      background-color: #2c2c2e;
      color: #7a3232;
      transition: background-color 0.38s cubic-bezier(0.25, 1, 0.5, 1), 
                  color 0.38s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.1s ease;
    }

    .action-btn-delete.has-selection {
      background-color: rgba(255, 59, 48, 0.22);
      color: var(--status-red);
    }

    .action-btn-delete.has-selection:active {
      background-color: rgba(255, 59, 48, 0.35);
      transform: scale(0.95);
    }

    .modal-body {
      overflow-y: auto;
      flex-grow: 1;
      padding: 0;
      position: relative;
    }

    .modal-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .modal-list li {
      position: relative;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 400;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a0a;
      border-bottom: 1px solid #2c2c2e;
      overflow: hidden;
      max-height: 60px;
      opacity: 1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                  opacity 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                  padding 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                  background-color 0.2s ease;
    }

    .modal-list li.deleting {
      max-height: 0 !important;
      opacity: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
    }

    .modal-list li:last-child {
      border-bottom: none;
    }

    .modal-row-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      will-change: transform;
      transform: translateX(0px);
      transition: transform 0.52s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-list li span:first-child {
      color: #ffffff;
      display: flex;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-modify: read-only;
    }

    .selection-circle {
      position: absolute;
      left: -32px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #545458;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      transform: translateX(0px);
      transition: transform 0.52s cubic-bezier(0.16, 1, 0.3, 1), 
                  background-color 0.15s ease, 
                  border-color 0.15s ease;
    }

    .selection-circle::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .is-editing .modal-row-content {
      transform: translateX(36px);
      transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .is-editing .selection-circle {
      transform: translateX(50px);
      transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  background-color 0.15s ease, 
                  border-color 0.15s ease;
    }

    .is-editing .status-flash {
      display: none !important;
    }

    .modal-list li.selected-row {
      background-color: #1c1c1e !important;
    }

    .modal-list li.selected-row .selection-circle {
      background-color: var(--ios-blue);
      border-color: var(--ios-blue);
    }

    .modal-list li.selected-row .selection-circle::after {
      opacity: 1;
    }

    canvas#analysis-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="scanner-container">
      <div id="interactive"></div>
      
      <div id="custom-overlay">
        <div id="custom-viewfinder">
          <div class="scanner-corner tl"></div>
          <div class="scanner-corner tr"></div>
          <div class="scanner-corner bl"></div>
          <div class="scanner-corner br"></div>
        </div>
      </div>
    </div>

    <canvas id="analysis-canvas" width="120" height="90"></canvas>

    <div id="log-container">
      <div class="log-header-row">
        <div class="header-left-group">
          <h3>TOTAL (<span id="count">0</span>)</h3>
        </div>
        
        <div class="status-dots-group" id="statusDotsGroup">
          <span class="status-dot" id="dot-1"></span>
          <span class="status-dot" id="dot-2"></span>
          <span class="status-dot" id="dot-3"></span>
          <span class="status-dot" id="dot-4"></span>
        </div>

        <div class="saved-label">SAVED</div>
      </div>
      
      <ul id="scanned-list"></ul>
    </div>

    <div id="control-panel">
      <div class="action-bar">
        <!-- UNDO BUTTON -->
        <button type="button" class="action-btn-undo" id="undo-btn" aria-label="Undo">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </button>

        <!-- MIDDLE COMBINED BAR (COPY + CREATE) -->
        <div class="middle-bar" id="middle-bar-container">
          <button type="button" class="copy-hitbox" id="base-copy-btn" aria-label="Copy">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <div class="create-btn-static">
            <span>CREATE</span>
          </div>
        </div>

        <!-- DONE BUTTON -->
        <div class="done-btn-wrap">
          <button type="button" class="done-btn" id="done-btn">DONE</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-overlay">
    <div class="modal-card" id="modal-card">
      <div class="modal-header" id="modal-header">
        <div class="modal-title-wrap">
          <h4>TOTAL (<span id="modal-count">0</span>)</h4>
          <button type="button" class="icon-action-btn" id="modal-copy-btn">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="header-actions">
          <button class="edit-btn" id="modal-edit-btn">Edit</button>
          <div class="edit-actions-group">
            <button class="action-btn-cancel" id="edit-cancel-btn">
              <svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg>
            </button>
            <button class="action-btn-delete" id="edit-delete-btn">Delete</button>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-list" id="modal-scanned-list"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    function updateLayoutInsets() {
      if (!tg) return;

      const contentInset = tg.contentSafeAreaInset || tg.safeAreaInset;
      let topMargin = 56;
      let bottomMargin = 24;

      if (contentInset && contentInset.top > 0) {
        topMargin = contentInset.top + 8;
      }
      if (contentInset && contentInset.bottom > 0) {
        bottomMargin = contentInset.bottom + 10;
      }

      document.documentElement.style.setProperty('--tg-safe-top', `${topMargin}px`);
      document.documentElement.style.setProperty('--tg-safe-bottom', `${bottomMargin}px`);
    }

    if (tg) {
      tg.ready();
      tg.expand();

      if (typeof tg.requestFullscreen === 'function') {
        tg.requestFullscreen();
      }

      updateLayoutInsets();

      tg.onEvent('contentSafeAreaChanged', updateLayoutInsets);
      tg.onEvent('safeAreaChanged', updateLayoutInsets);
      tg.onEvent('fullscreenChanged', updateLayoutInsets);
    }

    const SECRET_KEY = "AkBR7!12K8Le#Bzz_ASH%PekMP45K416";

    let scannedCodes = [];
    const selectedSerialsInModal = new Set();
    const lockedCategoriesSet = new Set();
    const lockedRowsSet = new Set();
    
    const listElement = document.getElementById('scanned-list');
    const modalListElement = document.getElementById('modal-scanned-list');
    const countElement = document.getElementById('count');
    const modalCountElement = document.getElementById('modal-count');
    const viewfinder = document.getElementById('custom-viewfinder');
    const analysisCanvas = document.getElementById('analysis-canvas');
    const canvasCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });
    
    const modalOverlay = document.getElementById('modal-overlay');
    const modalCard = document.getElementById('modal-card');
    const modalHeader = document.getElementById('modal-header');
    const editBtn = document.getElementById('modal-edit-btn');
    const editCancelBtn = document.getElementById('edit-cancel-btn');
    const editDeleteBtn = document.getElementById('edit-delete-btn');
    const doneBtn = document.getElementById('done-btn');
    const baseCopyBtn = document.getElementById('base-copy-btn');
    const modalCopyBtn = document.getElementById('modal-copy-btn');
    const middleBarContainer = document.getElementById('middle-bar-container');

    const dotElements = [
      document.getElementById('dot-1'),
      document.getElementById('dot-2'),
      document.getElementById('dot-3'),
      document.getElementById('dot-4')
    ];

    let html5QrcodeScanner = null;
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let flashTimeout = null;
    let overrideTimeout = null;
    let duplicatePulseTimeout = null;
    let isOverrideState = false;
    let proximityInterval = null;
    let isModalOpen = false;
    let isEditMode = false;
    let isUndoAnimating = false;
    
    let activeUniqueCode = null;
    const recentlyAddedSet = new Set();

    function getIosLockSvgHTML() {
      return `<svg class="ios-lock-icon" viewBox="0 0 24 24"><path d="M17 9V7c0-2.8-2.2-5-5-5S7 4.2 7 7v2c-1.7 0-3 1.3-3 3v7c0 1.7 1.3 3 3 3h10c1.7 0 3-1.3 3-3v-7c0-1.7-1.3-3-3-3zM9 7c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V7z"/></svg>`;
    }

    function getIosUnlockSvgHTML() {
      return `<svg class="ios-lock-icon" viewBox="0 0 24 24"><path d="M17 10H9V7a3 3 0 0 1 6 0h2a5 5 0 0 0-10 0v3H7a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3z"/></svg>`;
    }

    function sanitizeScannedData(dataStr) {
      if (!dataStr) return "";
      return dataStr.replace(/[\x00-\x1F\x7F-\x9F]/g, "").trim();
    }

    function getRowByRawData(container, rawString) {
      if (!container || !rawString) return null;
      const allRows = container.querySelectorAll('li[data-raw]');
      for (let i = 0; i < allRows.length; i++) {
        if (allRows[i].getAttribute('data-raw') === rawString) {
          return allRows[i];
        }
      }
      return null;
    }

    function clearDotClasses() {
      dotElements.forEach(dot => {
        dot.className = 'status-dot';
      });
    }

    function setProximityLevel(level) {
      if (level === 1) {
        activeUniqueCode = null;
      }

      if (isOverrideState || isModalOpen) return;
      clearDotClasses();

      for (let i = 0; i < level; i++) {
        if (dotElements[i]) {
          dotElements[i].classList.add('active-white');
        }
      }
    }

    function triggerSuccessGreenState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      clearDotClasses();
      dotElements.forEach(dot => dot.classList.add('active-green'));

      overrideTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 700);
    }

    function triggerUnencryptedAmberState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      clearDotClasses();
      dotElements[0].classList.add('active-amber');
      dotElements[1].classList.add('active-amber');
      dotElements[2].classList.add('active-amber');

      overrideTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 900);
    }

    function triggerDuplicateBlueState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      clearDotClasses();
      
      dotElements[0].classList.add('active-blue');
      dotElements[1].classList.add('active-blue');

      duplicatePulseTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 500); 
    }

    function triggerUnreadableRedState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      clearDotClasses();
      dotElements[0].classList.add('active-red');

      if (viewfinder) {
        clearTimeout(flashTimeout);
        viewfinder.classList.remove('scan-success');
        viewfinder.classList.add('scan-error');
        
        flashTimeout = setTimeout(() => {
          viewfinder.classList.remove('scan-error');
        }, 900);
      }

      tg?.HapticFeedback?.notificationOccurred('error');

      overrideTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 900);
    }

    function triggerLockedErrorState(targetRaw = null) {
      triggerUnreadableRedState();
      
      if (viewfinder) {
        viewfinder.classList.remove('shake-error');
        void viewfinder.offsetWidth;
        viewfinder.classList.add('shake-error');
        setTimeout(() => viewfinder.classList.remove('shake-error'), 450);
      }

      if (targetRaw) {
        const targetElement = getRowByRawData(listElement, targetRaw);
        if (targetElement) {
          pinRowToTop(listElement, targetElement);
        }
      }
    }

    function tryDecrypt(rawText) {
      const sanitized = sanitizeScannedData(rawText);
      try {
        const trimmed = rawText.trim();
        let decryptedText = "";

        let bytes = CryptoJS.AES.decrypt(trimmed, SECRET_KEY);
        decryptedText = bytes.toString(CryptoJS.enc.Utf8);

        if (!decryptedText && /^[0-9a-fA-F]+$/.test(trimmed)) {
          const cipherTextWordArray = CryptoJS.enc.Hex.parse(trimmed);
          const cipherParams = CryptoJS.lib.CipherParams.create({
            ciphertext: cipherTextWordArray
          });
          
          bytes = CryptoJS.AES.decrypt(cipherParams, SECRET_KEY);
          decryptedText = bytes.toString(CryptoJS.enc.Utf8);
        }

        if (decryptedText && decryptedText.length > 0) {
          return { 
            text: sanitizeScannedData(decryptedText), 
            rawInput: sanitized,
            isEncrypted: true 
          };
        }
      } catch (err) {}

      return { 
        text: sanitized, 
        rawInput: sanitized,
        isEncrypted: false 
      };
    }

    function analyzeFrameProximity() {
      if (isOverrideState || isModalOpen) return;

      const videoElement = document.querySelector("#interactive video");
      if (!videoElement || videoElement.readyState < 2) return;

      try {
        canvasCtx.drawImage(videoElement, 0, 0, 120, 90);
        const imgData = canvasCtx.getImageData(30, 22, 60, 45).data;
        
        let totalContrast = 0;

        for (let i = 0; i < imgData.length; i += 8) {
          const r = imgData[i];
          if (i > 8) {
            const prevR = imgData[i - 8];
            totalContrast += Math.abs(r - prevR);
          }
        }

        const avgContrast = totalContrast / (imgData.length / 8);

        if (avgContrast < 12) {
          setProximityLevel(1);
        } else if (avgContrast >= 12 && avgContrast < 22) {
          setProximityLevel(2);
        } else if (avgContrast >= 22 && avgContrast < 35) {
          setProximityLevel(3);
        } else if (avgContrast >= 35) {
          setProximityLevel(4);
        }
      } catch (e) {}
    }

    function startScanner() {
      html5QrcodeScanner = new Html5Qrcode("interactive");
      
      const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
        let boxWidth = Math.floor(minEdgeSize * 0.75);
        let boxHeight = Math.floor(minEdgeSize * 0.55);
        return { width: boxWidth, height: boxHeight };
      }

      const config = { 
        fps: 15, 
        qrbox: qrboxFunction, 
        aspectRatio: 1.333334 
      };
      
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanError)
      .then(() => {
        setProximityLevel(1);
        proximityInterval = setInterval(analyzeFrameProximity, 100);
      })
      .catch((err) => alert("Camera setup error: " + err));
    }

    function onScanError(errorMessage) {
      if (isModalOpen) return;
      if (errorMessage && errorMessage.includes("ChecksumException")) {
        triggerUnreadableRedState();
      }
    }

    function updateDeleteButtonState() {
      if (selectedSerialsInModal.size > 0) {
        editDeleteBtn.classList.add('has-selection');
      } else {
        editDeleteBtn.classList.remove('has-selection');
      }
    }

    function triggerUnlockMorphAndFade(containerElement, onComplete) {
      const lockContainer = containerElement.querySelector('.row-status-icon') || containerElement.querySelector('div:last-child');
      if (!lockContainer) {
        onComplete();
        return;
      }
      lockContainer.innerHTML = getIosUnlockSvgHTML();
      const unlockSvg = lockContainer.querySelector('.ios-lock-icon');
      if (unlockSvg) {
        setTimeout(() => unlockSvg.classList.add('fade-out'), 50);
        setTimeout(() => onComplete(), 400);
      } else {
        onComplete();
      }
    }

    function buildGroupedDOM(targetContainer, isModal = false) {
      targetContainer.innerHTML = "";
      const groups = {};
      
      scannedCodes.forEach(item => {
        if (item.isEncrypted) {
          const match = item.text.match(/^\(([A-Za-z0-9\s_-]+)\)\s*(.+)$/);
          if (match) {
            const type = match[1].trim().toUpperCase();
            const sn = match[2].trim();
            if (!groups[type]) groups[type] = [];
            groups[type].push({ display: sn, raw: item.rawInput, category: type });
            return;
          }
        }
        
        if (!groups["OTHERS"]) groups["OTHERS"] = [];
        groups["OTHERS"].push({ display: item.text, raw: item.rawInput, category: "OTHERS" });
      });
      
      const itemHeaders = Object.keys(groups)
        .filter(h => h !== "OTHERS")
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
      
      if (groups["OTHERS"]) {
        itemHeaders.push("OTHERS");
      }
      
      itemHeaders.forEach(headerName => {
        const categoryItems = groups[headerName];
        const categoryCount = categoryItems.length;
        const isCatLocked = lockedCategoriesSet.has(headerName);

        const headerLi = document.createElement('div');
        headerLi.className = 'list-category-header';
        
        const catLockIcon = isCatLocked ? getIosLockSvgHTML() : '';
        
        headerLi.innerHTML = `
          <div class="category-header-title">
            <span>${headerName} (${categoryCount})</span>
          </div>
          <div class="row-status-icon">${catLockIcon}</div>
        `;

        if (isModal) {
          let catPressTimer = null;
          headerLi.addEventListener('touchstart', (e) => {
            if (isEditMode) return;
            catPressTimer = setTimeout(() => {
              tg?.HapticFeedback?.impactOccurred('heavy');
              
              if (lockedCategoriesSet.has(headerName)) {
                triggerUnlockMorphAndFade(headerLi, () => {
                  lockedCategoriesSet.delete(headerName);
                  categoryItems.forEach(i => lockedRowsSet.delete(i.raw));
                  renderGroupedUI();
                });
              } else {
                lockedCategoriesSet.add(headerName);
                categoryItems.forEach(i => lockedRowsSet.add(i.raw));
                renderGroupedUI();
              }
            }, 500);
          }, { passive: true });

          headerLi.addEventListener('touchend', () => clearTimeout(catPressTimer));
          headerLi.addEventListener('touchmove', () => clearTimeout(catPressTimer));
        }

        targetContainer.appendChild(headerLi);
        
        categoryItems.sort((a, b) => a.display.localeCompare(b.display, undefined, { numeric: true, sensitivity: 'base' }));
        
        categoryItems.forEach(item => {
          const li = document.createElement('li');
          li.setAttribute('data-raw', item.raw);
          const isItemLocked = isCatLocked || lockedRowsSet.has(item.raw);

          if (isItemLocked) {
            li.classList.add('row-locked');
          }

          const statusRightContent = isItemLocked ? getIosLockSvgHTML() : '<span class="status-flash">✓</span>';

          if (isModal) {
            const isSelected = selectedSerialsInModal.has(item.raw);
            if (isSelected) li.classList.add('selected-row');

            li.innerHTML = `
              <div class="selection-circle"></div>
              <div class="modal-row-content">
                <span>${item.display}</span>
                <div class="row-status-icon">${statusRightContent}</div>
              </div>
            `;

            let rowPressTimer = null;
            li.addEventListener('touchstart', (e) => {
              if (isEditMode) return;
              rowPressTimer = setTimeout(() => {
                tg?.HapticFeedback?.impactOccurred('heavy');
                
                if (isCatLocked) {
                  return;
                }

                if (lockedRowsSet.has(item.raw)) {
                  triggerUnlockMorphAndFade(li, () => {
                    lockedRowsSet.delete(item.raw);
                    renderGroupedUI();
                  });
                } else {
                  lockedRowsSet.add(item.raw);
                  renderGroupedUI();
                }
              }, 500);
            }, { passive: true });

            li.addEventListener('touchend', () => clearTimeout(rowPressTimer));
            li.addEventListener('touchmove', () => clearTimeout(rowPressTimer));

            li.addEventListener('click', () => {
              if (!isEditMode) return;
              if (isItemLocked) return;

              if (selectedSerialsInModal.has(item.raw)) {
                selectedSerialsInModal.delete(item.raw);
                li.classList.remove('selected-row');
              } else {
                selectedSerialsInModal.add(item.raw);
                li.classList.add('selected-row');
                tg?.HapticFeedback?.impactOccurred('light');
              }
              updateDeleteButtonState();
            });
          } else {
            li.innerHTML = `<span>${item.display}</span><div class="row-status-icon">${statusRightContent}</div>`;
          }

          targetContainer.appendChild(li);
        });
      });
    }

    function pinRowToTop(container, rowElement) {
      if (!container || !rowElement) return;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const stickyHeader = container.querySelector('.list-category-header');
          const headerHeight = stickyHeader ? stickyHeader.offsetHeight : 0;

          const targetScrollTop = rowElement.offsetTop - headerHeight - 8;

          container.scrollTo({
            top: Math.max(0, targetScrollTop),
            behavior: 'smooth'
          });
        });
      });
    }

    function renderGroupedUI(newlyAddedRaw = null) {
      if (scannedCodes.length > 0) {
        listElement.classList.add('has-items');
      } else {
        listElement.classList.remove('has-items');
      }

      buildGroupedDOM(listElement, false);
      buildGroupedDOM(modalListElement, true);

      if (newlyAddedRaw) {
        const targetElement = getRowByRawData(listElement, newlyAddedRaw);
        if (targetElement) {
          pinRowToTop(listElement, targetElement);
          targetElement.classList.add('pulse-new-item');
          setTimeout(() => {
            targetElement.classList.remove('pulse-new-item');
          }, 1400);
        }
      }
    }

    function getCategoryForItem(item) {
      if (item.isEncrypted) {
        const match = item.text.match(/^\(([A-Za-z0-9\s_-]+)\)\s*(.+)$/);
        if (match) return match[1].trim().toUpperCase();
      }
      return "OTHERS";
    }

    function onScanSuccess(decodedText) {
      if (isModalOpen || isUndoAnimating) return;

      const now = Date.now();
      
      const result = tryDecrypt(decodedText);
      const processedText = result.text;
      const rawInput = result.rawInput;
      const isEncrypted = result.isEncrypted;

      if (!processedText || processedText.length === 0) {
        triggerUnreadableRedState();
        return;
      }

      const isDuplicate = scannedCodes.some(item => item.rawInput === rawInput);
      const itemCategory = getCategoryForItem({ text: processedText, isEncrypted: isEncrypted });
      const isLocked = lockedCategoriesSet.has(itemCategory) || lockedRowsSet.has(rawInput);

      if (isDuplicate && recentlyAddedSet.has(rawInput)) {
        return;
      }

      if (isDuplicate && isLocked) {
        triggerDuplicateBlueState();
        
        if (viewfinder) {
          viewfinder.classList.add('scan-duplicate-locked');
          clearTimeout(window.lockedDuplicateViewfinderTimeout);
          window.lockedDuplicateViewfinderTimeout = setTimeout(() => {
            viewfinder.classList.remove('scan-duplicate-locked');
          }, 600); 
        }

        const targetElement = getRowByRawData(listElement, rawInput);
        if (targetElement) {
          pinRowToTop(listElement, targetElement);
          targetElement.classList.add('locked-duplicate-persistent');
          clearTimeout(targetElement.lockedDupTimeout);
          targetElement.lockedDupTimeout = setTimeout(() => {
            targetElement.classList.remove('locked-duplicate-persistent');
          }, 600);
        }
        lastScannedTime = now;
        return;
      } else if (isLocked) {
        triggerLockedErrorState(rawInput);
        return;
      }

      if (viewfinder) {
        clearTimeout(flashTimeout);
        viewfinder.classList.remove('scan-error');
      }

      if (isDuplicate) {
        triggerDuplicateBlueState();
        
        if (viewfinder) {
          viewfinder.classList.add('scan-success');
          flashTimeout = setTimeout(() => {
            viewfinder.classList.remove('scan-success');
          }, 900); 
        }

        const targetElement = getRowByRawData(listElement, rawInput);
        if (targetElement) {
          pinRowToTop(listElement, targetElement);
          targetElement.classList.add('unlocked-duplicate-persistent');
          clearTimeout(targetElement.unlockedDupTimeout);
          targetElement.unlockedDupTimeout = setTimeout(() => {
            targetElement.classList.remove('unlocked-duplicate-persistent');
          }, 600);
        }

        lastScannedTime = now;
        return;
      }

      activeUniqueCode = rawInput;

      if (isEncrypted) {
        triggerSuccessGreenState();
      } else {
        triggerUnencryptedAmberState();
      }

      if (viewfinder) {
        viewfinder.classList.add('scan-success');
        flashTimeout = setTimeout(() => {
          viewfinder.classList.remove('scan-success');
        }, 900); 
      }

      lastScannedCode = decodedText;
      lastScannedTime = now;

      scannedCodes.unshift({ text: processedText, rawInput: rawInput, isEncrypted: isEncrypted });
      
      recentlyAddedSet.add(rawInput);
      setTimeout(() => {
        recentlyAddedSet.delete(rawInput);
      }, 1500);

      countElement.innerText = scannedCodes.length;
      modalCountElement.innerText = scannedCodes.length;
      renderGroupedUI(rawInput);
      tg?.HapticFeedback?.notificationOccurred('success');
    }

    viewfinder.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isModalOpen) {
        triggerUnreadableRedState();
      }
    });

    function openModal() {
      if (scannedCodes.length === 0) return;

      isModalOpen = true;
      modalOverlay.classList.add('active');
      tg?.HapticFeedback?.impactOccurred('medium');
    }

    function closeModal() {
      exitEditMode();
      modalOverlay.classList.remove('active');
      isModalOpen = false;
      setProximityLevel(1);
    }

    function enterEditMode() {
      isEditMode = true;
      updateDeleteButtonState();
      modalHeader.classList.add('is-editing');
      modalListElement.classList.add('is-editing');
    }

    function exitEditMode() {
      isEditMode = false;
      selectedSerialsInModal.clear();
      updateDeleteButtonState();
      modalHeader.classList.remove('is-editing');
      modalListElement.classList.remove('is-editing');
      
      const rowElements = modalListElement.querySelectorAll('li');
      rowElements.forEach(row => row.classList.remove('selected-row'));
    }

    function formatDataForClipboard() {
      if (scannedCodes.length === 0) return "";

      let formattedText = "Scanned Items\n\n";
      const groups = {};

      scannedCodes.forEach(item => {
        let disp = item.text;
        let cat = "OTHERS";
        if (item.isEncrypted) {
          const match = item.text.match(/^\(([A-Za-z0-9\s_-]+)\)\s*(.+)$/);
          if (match) {
            cat = match[1].trim().toUpperCase();
            disp = match[2].trim();
          }
        }
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(disp);
      });

      let headers = Object.keys(groups).filter(k => k !== "OTHERS");
      headers.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

      const sortSerials = (arr) => arr.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

      headers.forEach(header => {
        if (groups[header] && groups[header].length > 0) {
          formattedText += `${header}\n`;
          sortSerials(groups[header]).forEach(serial => {
            formattedText += `• ${serial}\n`;
          });
          formattedText += `\n`;
        }
      });

      if (groups["OTHERS"] && groups["OTHERS"].length > 0) {
        formattedText += `OTHERS\n`;
        sortSerials(groups["OTHERS"]).forEach(serial => {
          formattedText += `• ${serial}\n`;
        });
        formattedText += `\n`;
      }

      return formattedText.trim();
    }

    function handleCopyAction(buttonElement, containerToGlow = null) {
      if (scannedCodes.length === 0) return;

      const exportText = formatDataForClipboard();
      navigator.clipboard.writeText(exportText).then(() => {
        tg?.HapticFeedback?.notificationOccurred('success');
        if (containerToGlow) {
          containerToGlow.classList.add('copy-active');
          setTimeout(() => {
            containerToGlow.classList.remove('copy-active');
          }, 1500);
        } else if (buttonElement) {
          buttonElement.classList.add('copied');
          setTimeout(() => {
            buttonElement.classList.remove('copied');
          }, 1500);
        }
      }).catch(() => {
        tg?.HapticFeedback?.notificationOccurred('error');
      });
    }

    baseCopyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleCopyAction(baseCopyBtn, middleBarContainer);
    });

    modalCopyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleCopyAction(modalCopyBtn);
    });

    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tg?.HapticFeedback?.impactOccurred('light');
      enterEditMode();
    });

    editCancelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      exitEditMode();
    });

    editDeleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selectedSerialsInModal.size === 0) return;

      tg?.HapticFeedback?.impactOccurred('heavy');
      setTimeout(() => {
        tg?.HapticFeedback?.impactOccurred('heavy');
      }, 160);

      const allModalRows = modalListElement.querySelectorAll('li');
      allModalRows.forEach(row => {
        const raw = row.getAttribute('data-raw');
        if (selectedSerialsInModal.has(raw)) {
          row.classList.add('deleting');
        }
      });

      setTimeout(() => {
        scannedCodes = scannedCodes.filter(item => !selectedSerialsInModal.has(item.rawInput));
        
        exitEditMode();

        setTimeout(() => {
          countElement.innerText = scannedCodes.length;
          modalCountElement.innerText = scannedCodes.length;
          renderGroupedUI();

          if (scannedCodes.length === 0) {
            closeModal();
          }
        }, 150);
      }, 380);
    });

    listElement.addEventListener('click', openModal);

    modalOverlay.addEventListener('click', (e) => {
      if (!modalCard.contains(e.target)) {
        closeModal();
      }
    });

    function sendSerialsBack(codeObjects) {
      if (proximityInterval) clearInterval(proximityInterval);
      
      const initDataUnsafe = tg?.initDataUnsafe;
      const chatId = initDataUnsafe?.user?.id;
      
      if (!chatId) {
        alert("System Error: Telegram chat context unavailable.");
        tg?.close();
        return;
      }

      const scriptBaseUrl = "https://script.google.com/macros/s/AKfycbwb1tV24CFzbcPD70iA09hprOUg7oMSq7hGCxavDbvr7WmRbsFfHuEtvPtQy2Y9flbtMQ/exec";
      
      const serialList = codeObjects.map(item => item.text);
      const serialsString = serialList.length > 0 ? serialList.join(",") : "No codes scanned";
      const serialsParam = encodeURIComponent(serialsString);
      const finalUrl = `${scriptBaseUrl}?chatId=${chatId}&serials=${serialsParam}`;

      const fetchPromise = fetch(finalUrl, { mode: 'no-cors' });
      const timeoutPromise = new Promise(resolve => setTimeout(resolve, 500));

      Promise.race([fetchPromise, timeoutPromise]).finally(() => {
        tg?.close();
      });
    }

    const undoBtn = document.getElementById('undo-btn');

    undoBtn.addEventListener('pointerdown', () => {
      tg?.HapticFeedback?.impactOccurred('light');
    });

    undoBtn.addEventListener('click', () => {
      if (scannedCodes.length === 0 || isUndoAnimating) return;

      let targetIndex = -1;
      for (let i = 0; i < scannedCodes.length; i++) {
        const item = scannedCodes[i];
        const cat = getCategoryForItem(item);
        if (!lockedCategoriesSet.has(cat) && !lockedRowsSet.has(item.rawInput)) {
          targetIndex = i;
          break;
        }
      }

      if (targetIndex === -1) {
        tg?.HapticFeedback?.notificationOccurred('error');
        return;
      }

      isUndoAnimating = true;
      const itemToDelete = scannedCodes[targetIndex];
      const targetElement = getRowByRawData(listElement, itemToDelete.rawInput);

      if (targetElement) {
        pinRowToTop(listElement, targetElement);
        
        targetElement.classList.add('undo-target-glow');
        tg?.HapticFeedback?.impactOccurred('medium');

        setTimeout(() => {
          targetElement.classList.add('undo-slide-out');
        }, 300);

        setTimeout(() => {
          targetElement.classList.add('undo-collapse');
        }, 600);

        setTimeout(() => {
          scannedCodes.splice(targetIndex, 1);
          countElement.innerText = scannedCodes.length;
          modalCountElement.innerText = scannedCodes.length;
          lastScannedCode = "";
          lastScannedTime = 0;
          activeUniqueCode = null;
          isUndoAnimating = false;
          renderGroupedUI();
        }, 900);
      } else {
        scannedCodes.splice(targetIndex, 1);
        countElement.innerText = scannedCodes.length;
        modalCountElement.innerText = scannedCodes.length;
        lastScannedCode = "";
        lastScannedTime = 0;
        activeUniqueCode = null;
        isUndoAnimating = false;
        renderGroupedUI();
        tg?.HapticFeedback?.impactOccurred('medium');
      }
    });

    doneBtn.addEventListener('pointerdown', () => {
      tg?.HapticFeedback?.impactOccurred('heavy');
    });

    doneBtn.addEventListener('click', () => {
      const container = document.querySelector('.app-container');
      const scannerContainer = document.getElementById('scanner-container');

      if (container) {
        container.classList.add('camera-stopped');
      }

      if (scannerContainer) {
        scannerContainer.style.display = 'none';
      }

      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop()
          .then(() => sendSerialsBack(scannedCodes))
          .catch(() => sendSerialsBack(scannedCodes));
      } else {
        sendSerialsBack(scannedCodes.length);
      }
    });

    window.addEventListener('DOMContentLoaded', startScanner);
  </script>
</body>
</html>
