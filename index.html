<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --tg-safe-top: 56px;
      --tg-safe-bottom: 24px;
      --app-corner-radius: 16px;
      --button-corner-radius: 12px;
      --status-red: #FF4433;
      --status-amber: #FFBD2E;
      --status-green: #00DB62;
      --status-blue: #0084FF;
      --status-white: #FFFFFF;
      --color-light-gray: #CDCDCD;
      --color-medium: #5F5F5F;
      --color-dark4: #2C2C2E;
      --color-dark3: #161616;
      --color-dark2: #0E0E0E;
      --ios-blue: #0084FF;
      --ios-blue-pressed: #0062cc;
      --ios-blue-muted-duplicate: #004080;
      --copy-btn-bg: #2c2c2e;
      --copy-btn-icon: #d1d1d6;
      --copy-success-bg: #103B23;
      --copy-success-icon: #00db62;
    }
    
    * {
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: var(--tg-safe-top);
      padding-bottom: 0px;
      padding-left: 16px;
      padding-right: 16px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      transition: padding-top 0.2s ease-out;
    }

    .app-container.camera-stopped {
      padding-top: calc(var(--tg-safe-top) + 70px) !important;
    }

    #scanner-container {
      position: relative; 
      width: 100%;
      max-width: 100%;
      border-radius: var(--app-corner-radius);
      overflow: hidden;
      background: #000000;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    #interactive {
      width: 100% !important;
      height: auto !important;
    }

    #interactive video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    #interactive * {
      border: none !important;
      border-color: transparent !important;
    }

    #custom-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #custom-viewfinder {
      position: relative;
      box-sizing: border-box;
      width: 75vw; 
      height: 55vw; 
      max-width: 75%;
      max-height: 55%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      border-radius: 18px; 
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.05s ease;
    }

    @keyframes iosShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-9px); }
      40%, 80% { transform: translateX(9px); }
    }

    #custom-viewfinder.shake-error {
      animation: iosShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .scanner-corner {
      position: absolute;
      width: 36px; 
      height: 36px; 
      box-sizing: border-box;
      transition: border-color 0.3s ease, filter 0.3s ease;
    }

    .tl {
      top: -3px; left: -3px;
      border-top: 5px solid #ffffff !important;
      border-left: 5px solid #ffffff !important;
      border-right: none !important; 
      border-bottom: none !important;
      border-top-left-radius: 21px;
    }

    .tr {
      top: -3px; right: -3px;
      border-top: 5px solid #ffffff !important;
      border-right: 5px solid #ffffff !important;
      border-left: none !important; 
      border-bottom: none !important;
      border-top-right-radius: 21px;
    }

    .bl {
      bottom: -3px; left: -3px;
      border-bottom: 5px solid #ffffff !important;
      border-left: 5px solid #ffffff !important;
      border-right: none !important; 
      border-top: none !important;
      border-bottom-left-radius: 21px;
    }

    .br {
      bottom: -3px; right: -3px;
      border-bottom: 5px solid #ffffff !important;
      border-right: 5px solid #ffffff !important;
      border-left: none !important; 
      border-top: none !important;
      border-bottom-right-radius: 21px;
    }

    #custom-viewfinder.scan-success .scanner-corner {
      border-color: #00db62 !important; 
      filter: drop-shadow(0px 0px 4px rgba(1, 231, 40, 0.75));
    }

    #custom-viewfinder.scan-error .scanner-corner {
      border-color: #ff4433 !important; 
      filter: drop-shadow(0px 0px 4px rgba(255, 68, 51, 0.75));
    }

    #custom-viewfinder.scan-duplicate-locked .scanner-corner {
      border-color: var(--ios-blue) !important;
      filter: drop-shadow(0px 0px 4px rgba(0, 132, 255, 0.75));
    }

    #log-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      margin-bottom: 0px;
      position: relative;
      overflow: hidden;
    }

    .log-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 6px 4px;
      flex-shrink: 0;
      height: 32px;
      position: relative;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* OFFLINE NO SIGNAL TEXT & ANIMATION */
    #no-signal-indicator {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--status-amber);
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      user-select: none;
      -webkit-user-select: none;
      text-shadow: 0 0 6px rgba(255, 189, 46, 0.6);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    #no-signal-indicator.active {
      opacity: 1;
      animation: pulseAmber 2s ease-in-out infinite;
    }

    @keyframes pulseAmber {
      0%, 100% {
        opacity: 1;
        text-shadow: 0 0 8px rgba(255, 189, 46, 0.8);
      }
      50% {
        opacity: 0.25;
        text-shadow: 0 0 2px rgba(255, 189, 46, 0.2);
      }
    }

    h3 {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      color: #a2a2a7; 
      letter-spacing: 0.4px;
      font-weight: 600;
      line-height: 32px;
    }

    /* PURE CSS SHAPES 4-DIGIT 7-SEGMENT DISPLAY */
    .seg7-display-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      user-select: none;
      -webkit-user-select: none;
      transform: skewX(-6deg);
      transform-origin: center center;
    }

    .seg7-digit-wrapper {
      position: relative;
      width: 13px;
      height: 24px;
    }

    .seg7-digit {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .seg7-segment {
      position: absolute;
      background-color: var(--color-dark2);
      transition: background-color 0.1s ease;
    }

    .seg-a {
      top: 0; left: 1px; width: 11px; height: 3px;
      clip-path: polygon(0% 0%, 100% 0%, 78% 100%, 22% 100%);
    }
    .seg-b {
      top: 1px; right: 0; width: 3px; height: 10.5px;
      clip-path: polygon(0% 20%, 100% 0%, 100% 100%, 0% 82%);
    }
    .seg-c {
      bottom: 1px; right: 0; width: 3px; height: 10.5px;
      clip-path: polygon(0% 18%, 100% 0%, 100% 100%, 0% 80%);
    }
    .seg-d {
      bottom: 0; left: 1px; width: 11px; height: 3px;
      clip-path: polygon(22% 0%, 78% 0%, 100% 100%, 0% 100%);
    }
    .seg-e {
      bottom: 1px; left: 0; width: 3px; height: 10.5px;
      clip-path: polygon(0% 0%, 100% 18%, 100% 80%, 0% 100%);
    }
    .seg-f {
      top: 1px; left: 0; width: 3px; height: 10.5px;
      clip-path: polygon(0% 0%, 100% 20%, 100% 82%, 0% 100%);
    }
    .seg-g {
      top: 10.5px; left: 1px; width: 11px; height: 3px;
      clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 80% 100%, 20% 100%, 0% 50%);
    }

    .seg7-digit.layer-base .seg7-segment {
      background-color: var(--color-dark2) !important;
    }

    .seg7-digit.layer-mid .seg7-segment {
      background-color: transparent;
    }
    .seg7-digit.layer-mid.lit .seg7-segment.active {
      background-color: var(--color-dark3) !important;
    }

    .seg7-digit.layer-top .seg7-segment {
      background-color: transparent;
    }
    .seg7-digit.layer-top.lit .seg7-segment.active {
      background-color: var(--status-white) !important;
      box-shadow: 0 0 2px rgba(255, 255, 255, 0.4);
    }

    .seg7-layers-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* DOTMATRIX DISPLAY GRID */
    .dotmatrix-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      justify-content: center;
      height: 32px;
    }

    .dotmatrix-row {
      display: flex;
      gap: 2px;
    }

    .dotmatrix-square {
      width: 7px;
      height: 7px;
      border-radius: 1px;
      background-color: var(--color-dark2);
      transition: background-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .icon-action-btn {
      background-color: var(--copy-btn-bg);
      color: var(--copy-btn-icon);
      cursor: pointer;
      border: none;
      padding: 0 10px;
      min-width: 36px;
      height: 32px;
      border-radius: var(--button-corner-radius);
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.08s ease;
      box-sizing: border-box;
    }

    .icon-action-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--copy-btn-icon);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .icon-action-btn.copied {
      background-color: var(--copy-success-bg) !important;
    }

    .icon-action-btn.copied svg {
      stroke: var(--copy-success-icon) !important;
    }

    #scanned-list {
      list-style-type: none;
      padding: 0;
      padding-bottom: 90px !important;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #2c2c2e; 
      border-radius: var(--app-corner-radius);
      background-color: #000000;
      overflow-y: auto;
      flex-grow: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: none;
      position: relative;
      z-index: 1;
    }

    #scanned-list.has-items {
      display: block;
    }

    .list-category-header {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #1c1c1e;
      padding: 4px 18px;
      font-size: 12px;
      font-weight: 700;
      color: #a2a2a7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2c2c2e;
      margin: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .category-header-title {
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-modify: read-only;
    }

    .ios-lock-icon {
      width: 18px;
      height: 18px;
      fill: #a2a2a7;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      transition: opacity 0.4s ease, transform 0.2s ease;
    }

    .ios-lock-icon.fade-out {
      opacity: 0;
      transform: scale(0.8);
    }

    #scanned-list li {
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 400;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a0a;
      border-bottom: 1px solid #2c2c2e; 
      transition: background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.55s cubic-bezier(0.25, 1, 0.5, 1), 
                  opacity 0.45s ease, 
                  max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1), 
                  padding 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: background-color, transform, opacity, max-height;
      overflow: hidden;
      max-height: 60px;
    }

    #scanned-list li:last-child {
      border-bottom: none;
    }

    #scanned-list li span:first-child {
      color: #ffffff;
      display: flex;
      align-items: center;
    }

    .row-status-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
    }

    .row-locked {
      opacity: 0.55 !important;
    }

    @keyframes rowPulseGreen {
      0% {
        background-color: #009945;
      }
      100% {
        background-color: #0a0a0a;
      }
    }

    #scanned-list li.pulse-new-item {
      animation: rowPulseGreen 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    #scanned-list li.locked-duplicate-persistent {
      background-color: var(--ios-blue-muted-duplicate) !important;
      opacity: 1 !important;
      transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
    }

    #scanned-list li.unlocked-duplicate-persistent {
      background-color: var(--ios-blue-muted-duplicate) !important;
      opacity: 1 !important;
      transition: background-color 0.2s ease-in-out, opacity 0.2s ease-in-out;
    }

    #scanned-list li.undo-target-glow {
      background-color: var(--status-red) !important;
    }

    #scanned-list li.undo-slide-out {
      background-color: var(--status-red) !important;
      transform: translateX(-105%);
      opacity: 0.2;
    }

    #scanned-list li.undo-collapse {
      max-height: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
      opacity: 0 !important;
    }

    .status-flash { 
      color: #00db62 !important; 
      font-weight: 500; 
      font-size: 15px; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #control-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: calc(var(--tg-safe-bottom) + 6px);
      padding-top: 20px;
      z-index: 20;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 50%, rgba(0,0,0,1) 100%);
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      height: 48px;
      pointer-events: auto;
    }

    .action-btn-undo {
      width: 54px;
      height: 48px;
      border-radius: 18px;
      background: #007aff;
      border: none;
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      position: relative;
      transition: transform 0.08s ease, background-color 0.08s ease, opacity 0.08s ease;
      box-sizing: border-box;
    }

    .action-btn-undo::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(to bottom, #7ce7ff 0%, #004080 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .action-btn-undo:active {
      transform: scale(0.92);
      background-color: #0062cc;
      opacity: 0.9;
    }

    .action-btn-undo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #7ce7ff;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
      z-index: 2;
    }

    .middle-bar {
      display: flex;
      align-items: center;
      flex-grow: 1;
      height: 48px;
      background: #242426;
      border-radius: 18px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
      overflow: hidden;
    }

    .middle-bar.copy-active {
      background: #103B23;
      box-shadow: 0 0 12px rgba(0, 219, 98, 0.4);
    }

    .copy-hitbox {
      background: transparent;
      border: none;
      height: 100%;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease;
      flex-shrink: 0;
    }

    .copy-hitbox:active {
      transform: scale(0.92);
    }

    .copy-hitbox svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #d1d1d6;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .middle-bar.copy-active .copy-hitbox svg {
      stroke: #00db62 !important;
    }

    .create-btn-static {
      flex-grow: 1;
      height: 100%;
      background: #141416;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E1E1E1;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      user-select: none;
      -webkit-user-select: none;
      padding: 0 8px;
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
    }

    .ticker-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      width: max-content;
    }

    .ticker-text {
      white-space: nowrap;
      display: inline-block;
    }

    .ticker-track.animate-marquee {
      animation: continuousMarquee 8s linear infinite;
    }

    @keyframes continuousMarquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .updown-arrow-icon {
      width: 14px;
      height: 14px;
      fill: #a2a2a7;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .done-btn-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .done-btn {
      position: relative;
      z-index: 2;
      height: 48px;
      padding: 0 26px;
      background: #EAEAEA;
      color: #000000;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      border-radius: 18px;
      border: 1px solid #707074;
      box-sizing: border-box;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, background-color 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .done-btn:active {
      transform: scale(0.94);
      background-color: #d8d8d8;
    }

    /* MODALS */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 72vh;
      background: rgba(28, 28, 30, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--app-corner-radius);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.92);
      transition: transform 0.38s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      min-height: 44px;
      max-height: 44px;
      background: rgba(44, 44, 46, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-header h4 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #a2a2a7;
      font-weight: 700;
      height: 32px;
      line-height: 32px;
    }

    .header-actions {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 32px;

  <script>
    const tg = window.Telegram?.WebApp;

    function updateLayoutInsets() {
      if (!tg) return;

      const contentInset = tg.contentSafeAreaInset || tg.safeAreaInset;
      let topMargin = 56;
      let bottomMargin = 24;

      if (contentInset && contentInset.top > 0) {
        topMargin = contentInset.top + 8;
      }
      if (contentInset && contentInset.bottom > 0) {
        bottomMargin = contentInset.bottom + 10;
      }

      document.documentElement.style.setProperty('--tg-safe-top', `${topMargin}px`);
      document.documentElement.style.setProperty('--tg-safe-bottom', `${bottomMargin}px`);
    }

    if (tg) {
      tg.ready();
      tg.expand();

      if (typeof tg.requestFullscreen === 'function') {
        tg.requestFullscreen();
      }

      updateLayoutInsets();

      tg.onEvent('contentSafeAreaChanged', updateLayoutInsets);
      tg.onEvent('safeAreaChanged', updateLayoutInsets);
      tg.onEvent('fullscreenChanged', updateLayoutInsets);
    }

    const SECRET_KEY = "AkBR7!12K8Le#Bzz_ASH%PekMP45K416";

    let scannedCodes = [];
    const selectedSerialsInModal = new Set();
    const selectedCategoriesInModal = new Set();
    const lockedCategoriesSet = new Set();
    const lockedRowsSet = new Set();
    
    let customCategories = []; 
    let activeFocusCategory = null; 
    let isFocusModalOpen = false;
    let isFocusHeaderEditMode = false;

    const listElement = document.getElementById('scanned-list');
    const modalListElement = document.getElementById('modal-scanned-list');
    const countElement = document.getElementById('count');
    const modalCountElement = document.getElementById('modal-count');
    const seg7Container = document.getElementById('seg7-container');
    const viewfinder = document.getElementById('custom-viewfinder');
    const analysisCanvas = document.getElementById('analysis-canvas');
    const canvasCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });
    const noSignalIndicator = document.getElementById('no-signal-indicator');

    // NETWORK OFFLINE / NO SIGNAL DETECTOR
    function checkNetworkConnection() {
      if (!navigator.onLine) {
        noSignalIndicator.classList.add('active');
      } else {
        noSignalIndicator.classList.remove('active');
      }
    }

    window.addEventListener('online', checkNetworkConnection);
    window.addEventListener('offline', checkNetworkConnection);

    // Pure Shape Seven-Segment Logic Mapping
    const SEGMENT_MAP = {
      '0': ['a', 'b', 'c', 'd', 'e', 'f'],
      '1': ['b', 'c'],
      '2': ['a', 'b', 'g', 'e', 'd'],
      '3': ['a', 'b', 'g', 'c', 'd'],
      '4': ['f', 'g', 'b', 'c'],
      '5': ['a', 'f', 'g', 'c', 'd'],
      '6': ['a', 'f', 'e', 'd', 'c', 'g'],
      '7': ['a', 'b', 'c'],
      '8': ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
      '9': ['a', 'b', 'c', 'd', 'f', 'g']
    };

    function createSingleDigitHTML(char, layerClass, isLit = true) {
      const activeSegments = SEGMENT_MAP[char] || [];
      return `
        <div class="seg7-digit ${layerClass} ${isLit ? 'lit' : ''}">
          <div class="seg7-segment seg-a ${activeSegments.includes('a') ? 'active' : ''}"></div>
          <div class="seg7-segment seg-b ${activeSegments.includes('b') ? 'active' : ''}"></div>
          <div class="seg7-segment seg-c ${activeSegments.includes('c') ? 'active' : ''}"></div>
          <div class="seg7-segment seg-d ${activeSegments.includes('d') ? 'active' : ''}"></div>
          <div class="seg7-segment seg-e ${activeSegments.includes('e') ? 'active' : ''}"></div>
          <div class="seg7-segment seg-f ${activeSegments.includes('f') ? 'active' : ''}"></div>
          <div class="seg7-segment seg-g ${activeSegments.includes('g') ? 'active' : ''}"></div>
        </div>
      `;
    }

    function init7SegmentDisplayDOM() {
      seg7Container.innerHTML = '';
      for (let pos = 0; pos < 4; pos++) {
        const digitWrapper = document.createElement('div');
        digitWrapper.className = 'seg7-digit-wrapper';

        digitWrapper.innerHTML = `
          <div class="seg7-layers-wrapper">
            ${createSingleDigitHTML('8', 'layer-base', true)}
          </div>
          <div class="seg7-layers-wrapper mid-layer-pos" style="pointer-events:none;">
            ${createSingleDigitHTML('8', 'layer-mid', false)}
          </div>
          <div class="seg7-layers-wrapper top-layer-pos" style="pointer-events:none;">
            ${createSingleDigitHTML('8', 'layer-top', false)}
          </div>
        `;
        seg7Container.appendChild(digitWrapper);
      }
    }

    function update7SegmentDisplay(val) {
      const count = parseInt(val, 10) || 0;
      const digitWrappers = seg7Container.querySelectorAll('.seg7-digit-wrapper');
      
      if (digitWrappers.length !== 4) return;

      if (count === 0) {
        digitWrappers.forEach((wrapper) => {
          wrapper.querySelector('.mid-layer-pos').innerHTML = createSingleDigitHTML('8', 'layer-mid', false);
          wrapper.querySelector('.top-layer-pos').innerHTML = createSingleDigitHTML('8', 'layer-top', false);
        });
        return;
      }

      const countStr = Math.min(count, 9999).toString().padStart(4, ' ');
      
      for (let i = 0; i < 4; i++) {
        const char = countStr[i];
        const wrapper = digitWrappers[i];
        const midLayerContainer = wrapper.querySelector('.mid-layer-pos');
        const topLayerContainer = wrapper.querySelector('.top-layer-pos');

        if (char === ' ') {
          midLayerContainer.innerHTML = createSingleDigitHTML('8', 'layer-mid', false);
          topLayerContainer.innerHTML = createSingleDigitHTML('8', 'layer-top', false);
        } else {
          midLayerContainer.innerHTML = createSingleDigitHTML('8', 'layer-mid', true);
          topLayerContainer.innerHTML = createSingleDigitHTML(char, 'layer-top', true);
        }
      }
    }

    init7SegmentDisplayDOM();

    const countObserver = new MutationObserver(() => {
      update7SegmentDisplay(countElement.innerText);
    });
    countObserver.observe(countElement, { childList: true, characterData: true, subtree: true });

    const modalOverlay = document.getElementById('modal-overlay');
    const modalCard = document.getElementById('modal-card');

    // DOTMATRIX SPECIFIC COLOR CODES
    const COLOR_HEX = {
      blue: "#0084FF",
      amber: "#FFBD2E",
      green: "#00DB62",
      red: "#FF4433",
      white: "#FFFFFF",
      lightGray: "#CDCDCD",
      medium: "#5F5F5F",
      dark4: "#2C2C2E",
      dark3: "#161616",
      dark2: "#0E0E0E"
    };

    // Cache elements 1 through 20
    const squareElements = [];
    for (let i = 1; i <= 20; i++) {
      squareElements[i] = document.getElementById(`sq-${i}`);
    }

    let html5QrcodeScanner = null;
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let flashTimeout = null;
    let overrideTimeout = null;
    let duplicatePulseTimeout = null;
    let isOverrideState = false;
    let proximityInterval = null;
    let isModalOpen = false;
    let isEditMode = false;
    let isUndoAnimating = false;
    
    let activeUniqueCode = null;
    const recentlyAddedSet = new Set();

    function getIosLockSvgHTML() {
      return `<svg class="ios-lock-icon" viewBox="0 0 24 24"><path d="M17 9V7c0-2.8-2.2-5-5-5S7 4.2 7 7v2c-1.7 0-3 1.3-3 3v7c0 1.7 1.3 3 3 3h10c1.7 0 3-1.3 3-3v-7c0-1.7-1.3-3-3-3zM9 7c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V7z"/></svg>`;
    }

    function getIosUnlockSvgHTML() {
      return `<svg class="ios-lock-icon" viewBox="0 0 24 24"><path d="M17 10H9V7a3 3 0 0 1 6 0h2a5 5 0 0 0-10 0v3H7a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3z"/></svg>`;
    }

    function sanitizeScannedData(dataStr) {
      if (!dataStr) return "";
      return dataStr.replace(/[\x00-\x1F\x7F-\x9F]/g, "").trim();
    }

    function parseBracketPattern(str) {
      if (!str) return null;
      const match = str.match(/^\(([^)]+)\)\s*(.+)$/s);
      if (match) {
        return {
          category: match[1].trim().toUpperCase(),
          serial: match[2].trim()
        };
      }
      return null;
    }

    function getRowByRawData(container, rawString) {
      if (!container || !rawString) return null;
      const allRows = container.querySelectorAll('li[data-raw]');
      for (let i = 0; i < allRows.length; i++) {
        if (allRows[i].getAttribute('data-raw') === rawString) {
          return allRows[i];
        }
      }
      return null;
    }

    // DOTMATRIX COLOR MAPPER FUNCTION
    function setDotMatrixColors(colorArray) {
      for (let i = 1; i <= 20; i++) {
        if (squareElements[i]) {
          const colorCode = colorArray[i - 1] || COLOR_HEX.dark2;
          squareElements[i].style.backgroundColor = colorCode;
          if (colorCode === COLOR_HEX.white || colorCode === COLOR_HEX.green) {
            squareElements[i].style.boxShadow = `0 0 4px ${colorCode}66`;
          } else {
            squareElements[i].style.boxShadow = 'none';
          }
        }
      }
    }

    function setDotMatrixInactive() {
      setDotMatrixColors(Array(20).fill(COLOR_HEX.dark2));
    }

    // PROXIMITY GRADIENT SCALING (1 to 10 steps)
    function setProximityLevel(step) {
      if (step === 1) {
        activeUniqueCode = null;
      }

      if (isOverrideState || isModalOpen || isFocusModalOpen) return;

      const colors = Array(20).fill(COLOR_HEX.dark2);
      const gradientRamp = [
        COLOR_HEX.white,
        COLOR_HEX.lightGray,
        COLOR_HEX.medium,
        COLOR_HEX.dark4,
        COLOR_HEX.dark3
      ];

      if (step >= 10) {
        setDotMatrixColors(Array(20).fill(COLOR_HEX.white));
        return;
      }

      for (let col = 1; col <= 10; col++) {
        let colColor = COLOR_HEX.dark2;
        if (col <= step) {
          colColor = COLOR_HEX.white;
        } else {
          const offset = col - step - 1;
          if (offset >= 0 && offset < gradientRamp.length) {
            colColor = gradientRamp[offset];
          }
        }
        colors[col - 1] = colColor;       // Top row
        colors[col + 9] = colColor;      // Bottom row
      }

      setDotMatrixColors(colors);
    }

    function triggerSuccessGreenState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      
      setDotMatrixColors(Array(20).fill(COLOR_HEX.green));

      overrideTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 700);
    }

    function triggerUnencryptedAmberState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      
      const amberSquares = new Set([1,2,4,5,6,8,9,10,11,12,14,15,16,18,19,20]);
      const colors = Array.from({ length: 20 }, (_, i) => 
        amberSquares.has(i + 1) ? COLOR_HEX.amber : COLOR_HEX.dark2
      );

      setDotMatrixColors(colors);

      overrideTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 900);
    }

    function triggerDuplicateBlueState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      
      const blueSquares = new Set([1,2,4,5,6,8,9,10,11,12,14,15,16,18,19,20]);
      const colors = Array.from({ length: 20 }, (_, i) => 
        blueSquares.has(i + 1) ? COLOR_HEX.blue : COLOR_HEX.dark2
      );

      setDotMatrixColors(colors);

      duplicatePulseTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 500); 
    }

    function triggerUnreadableRedState() {
      isOverrideState = true;
      clearTimeout(overrideTimeout);
      clearTimeout(duplicatePulseTimeout);
      
      const redSquares = new Set([1,2,3,4,6,11,12,14,15]);
      const colors = Array.from({ length: 20 }, (_, i) => 
        redSquares.has(i + 1) ? COLOR_HEX.red : COLOR_HEX.dark2
      );

      setDotMatrixColors(colors);

      if (viewfinder) {
        clearTimeout(flashTimeout);
        viewfinder.classList.remove('scan-success');
        viewfinder.classList.add('scan-error');
        
        flashTimeout = setTimeout(() => {
          viewfinder.classList.remove('scan-error');
        }, 900);
      }

      tg?.HapticFeedback?.notificationOccurred('error');

      overrideTimeout = setTimeout(() => {
        isOverrideState = false;
        setProximityLevel(1);
      }, 900);
    }

    function triggerLockedErrorState(targetRaw = null) {
      triggerUnreadableRedState();
      
      if (viewfinder) {
        viewfinder.classList.remove('shake-error');
        void viewfinder.offsetWidth;
        viewfinder.classList.add('shake-error');
        setTimeout(() => viewfinder.classList.remove('shake-error'), 450);
      }

      if (targetRaw) {
        const targetElement = getRowByRawData(listElement, targetRaw);
        if (targetElement) {
          pinRowToTop(listElement, targetElement);
        }
      }
    }

    function tryDecrypt(rawText) {
      const sanitized = sanitizeScannedData(rawText);
      try {
        const trimmed = rawText.trim();
        let decryptedText = "";

        let bytes = CryptoJS.AES.decrypt(trimmed, SECRET_KEY);
        decryptedText = bytes.toString(CryptoJS.enc.Utf8);

        if (!decryptedText && /^[0-9a-fA-F]+$/.test(trimmed)) {
          const cipherTextWordArray = CryptoJS.enc.Hex.parse(trimmed);
          const cipherParams = CryptoJS.lib.CipherParams.create({
            ciphertext: cipherTextWordArray
          });
          
          bytes = CryptoJS.AES.decrypt(cipherParams, SECRET_KEY);
          decryptedText = bytes.toString(CryptoJS.enc.Utf8);
        }

        if (decryptedText && decryptedText.length > 0) {
          return { 
            text: sanitizeScannedData(decryptedText), 
            rawInput: sanitized,
            isEncrypted: true 
          };
        }
      } catch (err) {}

      const parsed = parseBracketPattern(sanitized);
      return { 
        text: sanitized, 
        rawInput: sanitized,
        isEncrypted: parsed !== null 
      };
    }

    function analyzeFrameProximity() {
      if (isOverrideState || isModalOpen || isFocusModalOpen) return;

      const videoElement = document.querySelector("#interactive video");
      if (!videoElement || videoElement.readyState < 2) return;

      try {
        canvasCtx.drawImage(videoElement, 0, 0, 120, 90);
        const imgData = canvasCtx.getImageData(30, 22, 60, 45).data;
        
        let totalContrast = 0;

        for (let i = 0; i < imgData.length; i += 8) {
          const r = imgData[i];
          if (i > 8) {
            const prevR = imgData[i - 8];
            totalContrast += Math.abs(r - prevR);
          }
        }

        const avgContrast = totalContrast / (imgData.length / 8);

        let calculatedStep = 1;
        if (avgContrast < 8) calculatedStep = 1;
        else if (avgContrast >= 8 && avgContrast < 12) calculatedStep = 2;
        else if (avgContrast >= 12 && avgContrast < 16) calculatedStep = 3;
        else if (avgContrast >= 16 && avgContrast < 20) calculatedStep = 4;
        else if (avgContrast >= 20 && avgContrast < 24) calculatedStep = 5;
        else if (avgContrast >= 24 && avgContrast < 28) calculatedStep = 6;
        else if (avgContrast >= 28 && avgContrast < 32) calculatedStep = 7;
        else if (avgContrast >= 32 && avgContrast < 36) calculatedStep = 8;
        else if (avgContrast >= 36 && avgContrast < 40) calculatedStep = 9;
        else if (avgContrast >= 40) calculatedStep = 10;

        setProximityLevel(calculatedStep);
      } catch (e) {}
    }

    function startScanner() {
      html5QrcodeScanner = new Html5Qrcode("interactive");
      
      const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
        let boxWidth = Math.floor(minEdgeSize * 0.75);
        let boxHeight = Math.floor(minEdgeSize * 0.55);
        return { width: boxWidth, height: boxHeight };
      }

      const config = { 
        fps: 15, 
        qrbox: qrboxFunction, 
        aspectRatio: 1.333334 
      };
      
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanError)
      .then(() => {
        setProximityLevel(1);
        proximityInterval = setInterval(analyzeFrameProximity, 100);
      })
      .catch((err) => alert("Camera setup error: " + err));
    }

    function ensureCameraRunning() {
      const videoElement = document.querySelector("#interactive video");
      if (videoElement && videoElement.paused) {
        videoElement.play().catch(() => {});
      }
    }

    function onScanError(errorMessage) {
      if (isModalOpen || isFocusModalOpen) return;
      if (errorMessage && errorMessage.includes("ChecksumException")) {
        triggerUnreadableRedState();
      }
    }

    function updateDeleteButtonState() {
      if (selectedSerialsInModal.size > 0) {
        editDeleteBtn.classList.add('has-selection');
      } else {
        editDeleteBtn.classList.remove('has-selection');
      }
    }

    function updateFocusDeleteButtonState() {
      if (selectedCategoriesInModal.size > 0) {
        focusEditDeleteBtn.classList.add('has-selection');
      } else {
        focusEditDeleteBtn.classList.remove('has-selection');
      }
    }

    function triggerUnlockMorphAndFade(containerElement, onComplete) {
      const lockContainer = containerElement.querySelector('.row-status-icon') || containerElement.querySelector('div:last-child');
      if (!lockContainer) {
        onComplete();
        return;
      }
      lockContainer.innerHTML = getIosUnlockSvgHTML();
      const unlockSvg = lockContainer.querySelector('.ios-lock-icon');
      if (unlockSvg) {
        setTimeout(() => unlockSvg.classList.add('fade-out'), 50);
        setTimeout(() => onComplete(), 400);
      } else {
        onComplete();
      }
    }

    function updateActionBarButton() {
      if (activeFocusCategory) {
        createBtnArrow.style.display = 'block';

        const parentWidth = createBtnTarget.clientWidth - 32;
        
        const tempSpan = document.createElement('span');
        tempSpan.style.visibility = 'hidden';
        tempSpan.style.position = 'absolute';
        tempSpan.style.fontSize = '12px';
        tempSpan.style.fontWeight = '700';
        tempSpan.innerText = activeFocusCategory;
        document.body.appendChild(tempSpan);
        const textWidth = tempSpan.clientWidth;
        document.body.removeChild(tempSpan);

        if (textWidth > parentWidth) {
          const formattedString = `${activeFocusCategory}\u00A0\u00A0\u00A0\u00A0`;
          createBtnText.innerText = formattedString;
          createBtnTextClone.innerText = formattedString;
          createBtnTextClone.style.display = 'inline-block';
          tickerTrack.classList.add('animate-marquee');
        } else {
          createBtnText.innerText = activeFocusCategory;
          createBtnTextClone.innerText = '';
          createBtnTextClone.style.display = 'none';
          tickerTrack.classList.remove('animate-marquee');
        }
      } else {
        createBtnText.innerText = "CREATE";
        createBtnTextClone.innerText = '';
        createBtnTextClone.style.display = 'none';
        tickerTrack.classList.remove('animate-marquee');
        createBtnArrow.style.display = 'none';
      }
    }

    function getCategoryForItem(item) {
      if (item.focusCategory) return item.focusCategory;
      const parsed = parseBracketPattern(item.text);
      if (parsed) return parsed.category;
      return "OTHERS";
    }

    function getSerialForItem(item) {
      const parsed = parseBracketPattern(item.text);
      if (parsed) return parsed.serial;
      return item.text;
    }

    function buildGroupedDOM(targetContainer, isModal = false) {
      targetContainer.innerHTML = "";
      const groups = {};
      
      scannedCodes.forEach(item => {
        let type = getCategoryForItem(item);
        let displaySN = getSerialForItem(item);
        
        if (!groups[type]) groups[type] = [];
        groups[type].push({ display: displaySN, raw: item.rawInput, category: type, originalItem: item });
      });

      const itemHeaders = Object.keys(groups)
        .filter(h => h !== "OTHERS")
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
      
      if (groups["OTHERS"] && groups["OTHERS"].length > 0) {
        itemHeaders.push("OTHERS");
      }
      
      itemHeaders.forEach(headerName => {
        const categoryItems = groups[headerName];
        const categoryCount = categoryItems.length;
        
        const isFocusLocked = activeFocusCategory !== null && headerName !== activeFocusCategory;
        const isCatLocked = isFocusLocked || lockedCategoriesSet.has(headerName);

        const headerLi = document.createElement('div');
        headerLi.className = 'list-category-header';
        if (isFocusLocked) headerLi.classList.add('row-locked');
        
        const catLockIcon = isCatLocked ? getIosLockSvgHTML() : '';
        
        headerLi.innerHTML = `
          <div class="category-header-title">
            <span>${headerName} (${categoryCount})</span>
          </div>
          <div class="row-status-icon">${catLockIcon}</div>
        `;

        if (isModal) {
          let catPressTimer = null;
          headerLi.addEventListener('touchstart', (e) => {
            if (isEditMode || isFocusLocked) return;
            catPressTimer = setTimeout(() => {
              tg?.HapticFeedback?.impactOccurred('heavy');
              
              if (lockedCategoriesSet.has(headerName)) {
                triggerUnlockMorphAndFade(headerLi, () => {
                  lockedCategoriesSet.delete(headerName);
                  categoryItems.forEach(i => lockedRowsSet.delete(i.raw));
                  renderGroupedUI();
                });
              } else {
                lockedCategoriesSet.add(headerName);
                categoryItems.forEach(i => lockedRowsSet.add(i.raw));
                renderGroupedUI();
              }
            }, 500);
          }, { passive: true });

          headerLi.addEventListener('touchend', () => clearTimeout(catPressTimer));
          headerLi.addEventListener('touchmove', () => clearTimeout(catPressTimer));
        }

        targetContainer.appendChild(headerLi);
        
        categoryItems.sort((a, b) => a.display.localeCompare(b.display, undefined, { numeric: true, sensitivity: 'base' }));
        
        categoryItems.forEach(item => {
          const li = document.createElement('li');
          li.setAttribute('data-raw', item.raw);
          const isItemLocked = isCatLocked || lockedRowsSet.has(item.raw);

          if (isItemLocked) {
            li.classList.add('row-locked');
          }

          const statusRightContent = isItemLocked ? getIosLockSvgHTML() : '<span class="status-flash">✓</span>';

          if (isModal) {
            const isSelected = selectedSerialsInModal.has(item.raw);
            if (isSelected) li.classList.add('selected-row');

            li.innerHTML = `
              <div class="selection-circle"></div>
              <div class="modal-row-content">
                <span>${item.display}</span>
                <div class="row-status-icon">${statusRightContent}</div>
              </div>
            `;

            let rowPressTimer = null;
            li.addEventListener('touchstart', (e) => {
              if (isEditMode || isFocusLocked) return;
              rowPressTimer = setTimeout(() => {
                tg?.HapticFeedback?.impactOccurred('heavy');
                
                if (isCatLocked) {
                  return;
                }

                if (lockedRowsSet.has(item.raw)) {
                  triggerUnlockMorphAndFade(li, () => {
                    lockedRowsSet.delete(item.raw);
                    renderGroupedUI();
                  });
                } else {
                  lockedRowsSet.add(item.raw);
                  renderGroupedUI();
                }
              }, 500);
            }, { passive: true });

            li.addEventListener('touchend', () => clearTimeout(rowPressTimer));
            li.addEventListener('touchmove', () => clearTimeout(rowPressTimer));

            li.addEventListener('click', () => {
              if (!isEditMode) return;
              if (isItemLocked) return;

              if (selectedSerialsInModal.has(item.raw)) {
                selectedSerialsInModal.delete(item.raw);
                li.classList.remove('selected-row');
              } else {
                selectedSerialsInModal.add(item.raw);
                li.classList.add('selected-row');
                tg?.HapticFeedback?.impactOccurred('light');
              }
              updateDeleteButtonState();
            });
          } else {
            li.innerHTML = `<span>${item.display}</span><div class="row-status-icon">${statusRightContent}</div>`;
          }

          targetContainer.appendChild(li);
        });
      });

      updateFocusCategoryModalList();
    }

    function updateFocusCategoryModalList() {
      focusCatList.innerHTML = "";
      if (customCategories.length === 0) {
        const emptyLi = document.createElement('div');
        emptyLi.style.padding = '18px';
        emptyLi.style.textAlign = 'center';
        emptyLi.style.color = '#8e8e93';
        emptyLi.style.fontSize = '13px';
        emptyLi.innerText = 'No Custom Categories Created';
        focusCatList.appendChild(emptyLi);
        return;
      }

      customCategories.forEach((catName, index) => {
        const count = scannedCodes.filter(item => getCategoryForItem(item) === catName).length;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'focus-cat-item';
        itemDiv.setAttribute('data-category', catName);

        const isFocused = activeFocusCategory === catName;
        const isGreyed = activeFocusCategory !== null && !isFocused;
        const isSelected = selectedCategoriesInModal.has(catName);

        if (isFocused) itemDiv.classList.add('focused-active');
        if (isGreyed) itemDiv.classList.add('unfocused-greyed');
        if (isSelected && isFocusHeaderEditMode) itemDiv.classList.add('selected-row');

        itemDiv.innerHTML = `
          <div class="selection-circle"></div>
          <div class="focus-cat-left-content">
            <span class="rename-hitbox" style="padding: 4px 0;">${catName}</span>
          </div>
          <span style="display:flex; align-items:center; gap:8px;">
            ${isFocused ? '<span style="color:#00db62; font-size:12px;">ACTIVE</span>' : ''}
            <span style="font-weight:700;">(${count})</span>
          </span>
        `;

        let catTimer = null;

        itemDiv.addEventListener('touchstart', () => {
          if (isFocusHeaderEditMode) return;
          catTimer = setTimeout(() => {
            tg?.HapticFeedback?.impactOccurred('heavy');
            if (activeFocusCategory === catName) {
              activeFocusCategory = null; 
            } else {
              activeFocusCategory = catName; 
            }
            updateActionBarButton();
            renderGroupedUI();
          }, 500);
        }, { passive: true });

        itemDiv.addEventListener('touchend', () => clearTimeout(catTimer));
        itemDiv.addEventListener('touchmove', () => clearTimeout(catTimer));

        itemDiv.addEventListener('click', (e) => {
          if (isFocusHeaderEditMode) {
            if (e.target.closest('.rename-hitbox')) {
              setTimeout(() => {
                const newName = prompt("Edit category name:", catName);
                ensureCameraRunning();
                if (newName && newName.trim().length > 0) {
                  const sanitized = newName.trim().toUpperCase();
                  if (sanitized !== catName) {
                    customCategories[index] = sanitized;
                    if (activeFocusCategory === catName) activeFocusCategory = sanitized;
                    scannedCodes.forEach(item => {
                      if (item.focusCategory === catName) item.focusCategory = sanitized;
                    });

                    if (selectedCategoriesInModal.has(catName)) {
                      selectedCategoriesInModal.delete(catName);
                      selectedCategoriesInModal.add(sanitized);
                    }
                    
                    updateActionBarButton();
                    renderGroupedUI();
                  }
                }
              }, 50);
            } else {
              if (selectedCategoriesInModal.has(catName)) {
                selectedCategoriesInModal.delete(catName);
                itemDiv.classList.remove('selected-row');
              } else {
                selectedCategoriesInModal.add(catName);
                itemDiv.classList.add('selected-row');
                tg?.HapticFeedback?.impactOccurred('light');
              }
              updateFocusDeleteButtonState();
            }
          }
        });

        focusCatList.appendChild(itemDiv);
      });
    }

    function pinRowToTop(container, rowElement) {
      if (!container || !rowElement) return;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const stickyHeader = container.querySelector('.list-category-header');
          const headerHeight = stickyHeader ? stickyHeader.offsetHeight : 0;

          const targetScrollTop = rowElement.offsetTop - headerHeight - 8;

          container.scrollTo({
            top: Math.max(0, targetScrollTop),
            behavior: 'smooth'
          });
        });
      });
    }

    function renderGroupedUI(newlyAddedRaw = null) {
      if (scannedCodes.length > 0) {
        listElement.classList.add('has-items');
      } else {
        listElement.classList.remove('has-items');
      }

      buildGroupedDOM(listElement, false);
      buildGroupedDOM(modalListElement, true);

      if (newlyAddedRaw) {
        const targetElement = getRowByRawData(listElement, newlyAddedRaw);
        if (targetElement) {
          pinRowToTop(listElement, targetElement);
          targetElement.classList.add('pulse-new-item');
          setTimeout(() => {
            targetElement.classList.remove('pulse-new-item');
          }, 1400);
        }
      }
    }

    function onScanSuccess(decodedText) {
      if (isModalOpen || isFocusModalOpen || isUndoAnimating) return;

      const now = Date.now();
      
      const result = tryDecrypt(decodedText);
      let processedText = result.text;
      const rawInput = result.rawInput;
      const isEncrypted = result.isEncrypted;

      if (!processedText || processedText.length === 0) {
        triggerUnreadableRedState();
        return;
      }

      let currentFocusCategoryAssignment = null;
      if (activeFocusCategory) {
        currentFocusCategoryAssignment = activeFocusCategory;
        const parsed = parseBracketPattern(processedText);
        if (parsed) {
          processedText = parsed.serial;
        }
      }

      const isDuplicate = scannedCodes.some(item => item.rawInput === rawInput || item.text === processedText);
      const tempItem = { text: processedText, isEncrypted: isEncrypted, focusCategory: currentFocusCategoryAssignment };
      const itemCategory = getCategoryForItem(tempItem);
      
      const isLocked = (activeFocusCategory !== null && itemCategory !== activeFocusCategory) || 
                       lockedCategoriesSet.has(itemCategory) || 
                       lockedRowsSet.has(rawInput);

      if (isDuplicate && recentlyAddedSet.has(rawInput)) {
        return;
      }

      if (isDuplicate && isLocked) {
        triggerDuplicateBlueState();
        
        if (viewfinder) {
          viewfinder.classList.add('scan-duplicate-locked');
          clearTimeout(window.lockedDuplicateViewfinderTimeout);
          window.lockedDuplicateViewfinderTimeout = setTimeout(() => {
            viewfinder.classList.remove('scan-duplicate-locked');
          }, 600); 
        }

        const targetElement = getRowByRawData(listElement, rawInput);
        if (targetElement) {
          pinRowToTop(listElement, rawInput);
          targetElement.classList.add('locked-duplicate-persistent');
          clearTimeout(targetElement.lockedDupTimeout);
          targetElement.lockedDupTimeout = setTimeout(() => {
            targetElement.classList.remove('locked-duplicate-persistent');
          }, 600);
        }
        lastScannedTime = now;
        return;
      } else if (isLocked) {
        triggerLockedErrorState(rawInput);
        return;
      }

      if (viewfinder) {
        clearTimeout(flashTimeout);
        viewfinder.classList.remove('scan-error');
      }

      if (isDuplicate) {
        triggerDuplicateBlueState();
        
        if (viewfinder) {
          viewfinder.classList.add('scan-success');
          flashTimeout = setTimeout(() => {
            viewfinder.classList.remove('scan-success');
          }, 900); 
        }

        const targetElement = getRowByRawData(listElement, rawInput);
        if (targetElement) {
          pinRowToTop(listElement, rawInput);
          targetElement.classList.add('unlocked-duplicate-persistent');
          clearTimeout(targetElement.unlockedDupTimeout);
          targetElement.unlockedDupTimeout = setTimeout(() => {
            targetElement.classList.remove('unlocked-duplicate-persistent');
          }, 600);
        }

        lastScannedTime = now;
        return;
      }

      activeUniqueCode = rawInput;

      if (isEncrypted) {
        triggerSuccessGreenState();
      } else {
        triggerUnencryptedAmberState();
      }

      if (viewfinder) {
        viewfinder.classList.add('scan-success');
        flashTimeout = setTimeout(() => {
          viewfinder.classList.remove('scan-success');
        }, 900); 
      }

      lastScannedCode = decodedText;
      lastScannedTime = now;

      scannedCodes.unshift({ 
        text: processedText, 
        rawInput: rawInput, 
        isEncrypted: isEncrypted,
        focusCategory: currentFocusCategoryAssignment
      });
      
      recentlyAddedSet.add(rawInput);
      setTimeout(() => {
        recentlyAddedSet.delete(rawInput);
      }, 1500);

      countElement.innerText = scannedCodes.length;
      modalCountElement.innerText = scannedCodes.length;
      renderGroupedUI(rawInput);
      tg?.HapticFeedback?.notificationOccurred('success');
    }

    viewfinder.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isModalOpen && !isFocusModalOpen) {
        triggerUnreadableRedState();
      }
    });

    function openModal() {
      if (scannedCodes.length === 0) return;

      isModalOpen = true;
      setDotMatrixInactive();
      modalOverlay.classList.add('active');
      tg?.HapticFeedback?.impactOccurred('medium');
    }

    function closeModal() {
      exitEditMode();
      modalOverlay.classList.remove('active');
      isModalOpen = false;
      ensureCameraRunning();
      setProximityLevel(1);
    }

    function openFocusModal() {
      isFocusModalOpen = true;
      setDotMatrixInactive();
      focusModalOverlay.classList.add('active');
      updateFocusCategoryModalList();
    }

    function closeFocusModal() {
      exitFocusEditMode();
      focusModalOverlay.classList.remove('active');
      isFocusModalOpen = false;
      ensureCameraRunning();
      setProximityLevel(1);
    }

    function enterEditMode() {
      isEditMode = true;
      updateDeleteButtonState();
      modalHeader.classList.add('is-editing');
      modalListElement.classList.add('is-editing');
    }

    function exitEditMode() {
      try {
        isEditMode = false;
        selectedSerialsInModal.clear();
        updateDeleteButtonState();
        modalHeader.classList.remove('is-editing');
        modalListElement.classList.remove('is-editing');
        
        const rowElements = modalListElement.querySelectorAll('li');
        rowElements.forEach(row => row.classList.remove('selected-row'));
      } catch (e) {}
    }

    function enterFocusEditMode() {
      isFocusHeaderEditMode = true;
      selectedCategoriesInModal.clear();
      updateFocusDeleteButtonState();
      focusModalHeader.classList.add('is-editing');
      focusCatList.classList.add('is-editing');
    }

    function exitFocusEditMode() {
      try {
        isFocusHeaderEditMode = false;
        selectedCategoriesInModal.clear();
        updateFocusDeleteButtonState();
        focusModalHeader.classList.remove('is-editing');
        focusCatList.classList.remove('is-editing');
        
        const rowElements = focusCatList.querySelectorAll('.focus-cat-item');
        rowElements.forEach(row => row.classList.remove('selected-row'));
      } catch (e) {}
    }

    function formatDataForClipboard() {
      const processedItems = scannedCodes.map(item => {
        if (typeof item === 'string') {
          return tryDecrypt(item);
        }
        if (item && item.rawInput && !item.text) {
          return tryDecrypt(item.rawInput);
        }
        return item;
      }).filter(Boolean);

      const validItems = processedItems.filter(item => {
        const textStr = (item.text || "").trim().toLowerCase();
        const rawStr = (item.rawInput || "").trim().toLowerCase();
        return textStr !== "scanned items" && rawStr !== "scanned items";
      });

      if (validItems.length === 0) return "";

      let formattedText = "SERIALISED ITEMS\n\n";
      const groups = {};

      validItems.forEach(item => {
        let cat = getCategoryForItem(item);
        let serial = getSerialForItem(item);

        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(serial);
      });

      let headers = Object.keys(groups).filter(k => k !== "OTHERS");
      headers.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

      const sortSerials = (arr) => arr.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

      headers.forEach(header => {
        if (groups[header] && groups[header].length > 0) {
          formattedText += `${header}\n`;
          sortSerials(groups[header]).forEach(serial => {
            formattedText += `- ${serial}\n`;
          });
          formattedText += `\n`;
        }
      });

      if (groups["OTHERS"]) {
        const filteredOthers = groups["OTHERS"].filter(s => (s || "").trim().toLowerCase() !== "scanned items");
        if (filteredOthers.length > 0) {
          formattedText += `OTHERS\n`;
          sortSerials(filteredOthers).forEach(serial => {
            formattedText += `- ${serial}\n`;
          });
          formattedText += `\n`;
        }
      }

      return formattedText.trim();
    }

    function handleCopyAction(buttonElement, containerToGlow = null) {
      if (scannedCodes.length === 0) return;

      const exportText = formatDataForClipboard();
      navigator.clipboard.writeText(exportText).then(() => {
        tg?.HapticFeedback?.notificationOccurred('success');
        if (containerToGlow) {
          containerToGlow.classList.add('copy-active');
          setTimeout(() => {
            containerToGlow.classList.remove('copy-active');
          }, 1500);
        } else if (buttonElement) {
          buttonElement.classList.add('copied');
          setTimeout(() => {
            buttonElement.classList.remove('copied');
          }, 1500);
        }
      }).catch(() => {
        tg?.HapticFeedback?.notificationOccurred('error');
      });
    }

    baseCopyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleCopyAction(baseCopyBtn, middleBarContainer);
    });

    modalCopyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleCopyAction(modalCopyBtn);
    });

    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tg?.HapticFeedback?.impactOccurred('light');
      enterEditMode();
    });

    const handleEditCancel = (e) => {
      e.stopPropagation();
      e.preventDefault();
      exitEditMode();
    };
    editCancelBtn.addEventListener('click', handleEditCancel);
    editCancelBtn.addEventListener('touchstart', handleEditCancel, { passive: false });

    editDeleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selectedSerialsInModal.size === 0) return;

      tg?.HapticFeedback?.impactOccurred('heavy');
      setTimeout(() => {
        tg?.HapticFeedback?.impactOccurred('heavy');
      }, 160);

      const allModalRows = modalListElement.querySelectorAll('li');
      allModalRows.forEach(row => {
        const raw = row.getAttribute('data-raw');
        if (selectedSerialsInModal.has(raw)) {
          row.classList.add('deleting');
        }
      });

      setTimeout(() => {
        scannedCodes = scannedCodes.filter(item => !selectedSerialsInModal.has(item.rawInput));
        
        exitEditMode();

        setTimeout(() => {
          countElement.innerText = scannedCodes.length;
          modalCountElement.innerText = scannedCodes.length;
          renderGroupedUI();

          if (scannedCodes.length === 0) {
            closeModal();
          }
        }, 150);
      }, 380);
    });

    let createPressTimer = null;

    createBtnTarget.addEventListener('touchstart', (e) => {
      createPressTimer = setTimeout(() => {
        tg?.HapticFeedback?.impactOccurred('heavy');
        openFocusModal();
      }, 550);
    }, { passive: true });

    createBtnTarget.addEventListener('touchend', () => clearTimeout(createPressTimer));
    createBtnTarget.addEventListener('touchmove', () => clearTimeout(createPressTimer));

    focusAddCatBtn.addEventListener('click', () => {
      tg?.HapticFeedback?.impactOccurred('light');
      setTimeout(() => {
        const catName = prompt("Enter new category name:");
        ensureCameraRunning();
        if (catName && catName.trim().length > 0) {
          const sanitized = catName.trim().toUpperCase();
          if (!customCategories.includes(sanitized)) {
            customCategories.push(sanitized);
            if (!activeFocusCategory) {
              activeFocusCategory = sanitized;
              updateActionBarButton();
            }
            renderGroupedUI();
          }
        }
      }, 50);
    });

    focusHeaderEditBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tg?.HapticFeedback?.impactOccurred('light');
      enterFocusEditMode();
    });

    const handleFocusEditCancel = (e) => {
      e.stopPropagation();
      e.preventDefault();
      exitFocusEditMode();
    };
    focusEditCancelBtn.addEventListener('click', handleFocusEditCancel);
    focusEditCancelBtn.addEventListener('touchstart', handleFocusEditCancel, { passive: false });

    focusEditDeleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selectedCategoriesInModal.size === 0) return;

      tg?.HapticFeedback?.impactOccurred('heavy');
      setTimeout(() => {
        tg?.HapticFeedback?.impactOccurred('heavy');
      }, 160);

      const allFocusRows = focusCatList.querySelectorAll('.focus-cat-item');
      allFocusRows.forEach(row => {
        const cat = row.getAttribute('data-category');
        if (selectedCategoriesInModal.has(cat)) {
          row.classList.add('deleting');
        }
      });

      setTimeout(() => {
        selectedCategoriesInModal.forEach(cat => {
           customCategories = customCategories.filter(c => c !== cat);
           if (activeFocusCategory === cat) activeFocusCategory = null;
           scannedCodes = scannedCodes.filter(item => getCategoryForItem(item) !== cat);
        });
        
        exitFocusEditMode();
        
        setTimeout(() => {
          updateActionBarButton();
          countElement.innerText = scannedCodes.length;
          modalCountElement.innerText = scannedCodes.length;
          renderGroupedUI();
        }, 150);
      }, 380);
    });

    focusModalOverlay.addEventListener('click', (e) => {
      if (!focusModalCard.contains(e.target)) {
        closeFocusModal();
      }
    });

    listElement.addEventListener('click', openModal);

    modalOverlay.addEventListener('click', (e) => {
      if (!modalCard.contains(e.target)) {
        closeModal();
      }
    });

    function sendSerialsBack(codeObjects) {
      if (proximityInterval) clearInterval(proximityInterval);
      
      const initDataUnsafe = tg?.initDataUnsafe;
      const chatId = initDataUnsafe?.user?.id;
      
      if (!chatId) {
        alert("System Error: Telegram chat context unavailable.");
        tg?.close();
        return;
      }

      const scriptBaseUrl = "https://script.google.com/macros/s/AKfycbwb1tV24CFzbcPD70iA09hprOUg7oMSq7hGCxavDbvr7WmRbsFfHuEtvPtQy2Y9flbtMQ/exec";
      
      const formattedOutput = formatDataForClipboard();
      const serialsParam = encodeURIComponent(formattedOutput);
      const finalUrl = `${scriptBaseUrl}?chatId=${chatId}&serials=${serialsParam}`;

      const fetchPromise = fetch(finalUrl, { mode: 'no-cors' });
      const timeoutPromise = new Promise(resolve => setTimeout(resolve, 500));

      Promise.race([fetchPromise, timeoutPromise]).finally(() => {
        tg?.close();
      });
    }

    const undoBtn = document.getElementById('undo-btn');

    undoBtn.addEventListener('pointerdown', () => {
      tg?.HapticFeedback?.impactOccurred('light');
    });

    undoBtn.addEventListener('click', () => {
      if (scannedCodes.length === 0 || isUndoAnimating) return;

      let targetIndex = -1;
      for (let i = 0; i < scannedCodes.length; i++) {
        const item = scannedCodes[i];
        const cat = getCategoryForItem(item);

        if (activeFocusCategory !== null && cat !== activeFocusCategory) {
          continue;
        }

        if (!lockedCategoriesSet.has(cat) && !lockedRowsSet.has(item.rawInput)) {
          targetIndex = i;
          break;
        }
      }

      if (targetIndex === -1) {
        tg?.HapticFeedback?.notificationOccurred('error');
        return;
      }

      isUndoAnimating = true;
      const itemToDelete = scannedCodes[targetIndex];
      const targetElement = getRowByRawData(listElement, itemToDelete.rawInput);

      if (targetElement) {
        pinRowToTop(listElement, targetElement);
        
        targetElement.classList.add('undo-target-glow');
        tg?.HapticFeedback?.impactOccurred('medium');

        setTimeout(() => {
          targetElement.classList.add('undo-slide-out');
        }, 300);

        setTimeout(() => {
          targetElement.classList.add('undo-collapse');
        }, 600);

        setTimeout(() => {
          scannedCodes.splice(targetIndex, 1);
          countElement.innerText = scannedCodes.length;
          modalCountElement.innerText = scannedCodes.length;
          lastScannedCode = "";
          lastScannedTime = 0;
          activeUniqueCode = null;
          isUndoAnimating = false;
          renderGroupedUI();
        }, 900);
      } else {
        scannedCodes.splice(targetIndex, 1);
        countElement.innerText = scannedCodes.length;
        modalCountElement.innerText = scannedCodes.length;
        lastScannedCode = "";
        lastScannedTime = 0;
        activeUniqueCode = null;
        isUndoAnimating = false;
        renderGroupedUI();
        tg?.HapticFeedback?.impactOccurred('medium');
      }
    });

    doneBtn.addEventListener('pointerdown', () => {
      tg?.HapticFeedback?.impactOccurred('heavy');
    });

    doneBtn.addEventListener('click', () => {
      const container = document.querySelector('.app-container');
      const scannerContainer = document.getElementById('scanner-container');

      if (container) {
        container.classList.add('camera-stopped');
      }
      
      if (scannerContainer) {
        scannerContainer.style.display = 'none';
      }

      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          sendSerialsBack(scannedCodes);
        }).catch(err => {
          sendSerialsBack(scannedCodes);
        });
      } else {
        sendSerialsBack(scannedCodes);
      }
    });

    window.onload = () => {
      checkNetworkConnection();
      setTimeout(() => {
        startScanner();
      }, 300);
    };

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        ensureCameraRunning();
        checkNetworkConnection();
      }
    });

  </script>
</body>
