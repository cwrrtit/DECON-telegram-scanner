<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Interface</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --header-bg: #2c2c2e;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent-blue: #0a84ff;
      --success-green: #30d158;
      --copy-btn-bg: #3a3a3c;
      --copy-btn-icon: #d1d1d6;
      --copy-success-bg: #1c3b2b;
      --copy-success-icon: #30d158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-color);
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 17px;
      cursor: pointer;
    }

    /* Scanner Viewport */
    .scanner-viewport {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
    }

    .bounding-box {
      width: 250px;
      height: 250px;
      border: 4px solid var(--success-green);
      border-radius: 24px;
      position: relative;
    }

    /* Controls Bar above Sheet */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .total-count {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* Copy Button Styling */
    .copy-btn {
      background-color: var(--copy-btn-bg);
      border: none;
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .copy-btn svg {
      fill: var(--copy-btn-icon);
      width: 18px;
      height: 18px;
      transition: fill 0.2s;
    }

    .copy-btn.copied {
      background-color: var(--copy-success-bg);
    }

    .copy-btn.copied svg {
      fill: var(--copy-success-icon);
    }

    /* Bottom Sheet List */
    .sheet-container {
      background-color: var(--card-bg);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      max-height: 40vh;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .group-header {
      background-color: var(--header-bg);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      position: relative;
    }

    .group-header .lock-status {
      display: flex;
      align-items: center;
    }

    .item-row {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid #2c2c2e;
      font-family: monospace;
      font-size: 16px;
      position: relative;
      background-color: var(--card-bg);
    }

    .tick-icon {
      color: var(--success-green);
      font-weight: bold;
    }

    /* Lock/Unlock Floating Feedback Icon */
    .lock-feedback-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    .lock-feedback-icon.show {
      opacity: 1;
    }

    /* FaceID Shake Animation */
    @keyframes faceIdShake {
      0% { transform: translate(0, 0); }
      15% { transform: translate(-8px, -2px); }
      30% { transform: translate(8px, 2px); }
      45% { transform: translate(-6px, 1px); }
      60% { transform: translate(6px, -1px); }
      75% { transform: translate(-3px, 1px); }
      90% { transform: translate(3px, 0); }
      100% { transform: translate(0, 0); }
    }

    .shake-error {
      animation: faceIdShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      background-color: rgba(255, 59, 48, 0.15) !important;
    }

    /* Complete Button Container */
    .action-container {
      padding: 16px;
      background: var(--bg-color);
    }

    .btn-complete {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* SVG Icon Helpers */
    .icon-lock {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="btn-text">✕ Close</button>
  </div>

  <!-- Scanner Viewport -->
  <div class="scanner-viewport">
    <div class="bounding-box"></div>
  </div>

  <!-- Controls Above List -->
  <div class="controls-bar">
    <span class="total-count">TOTAL (1)</span>
    <button class="copy-btn" id="mainCopyBtn" onclick="executeCopy(this)">
      <svg viewBox="0 0 24 24">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
      </svg>
    </button>
  </div>

  <!-- Scanned Items Sheet -->
  <div class="sheet-container" id="sheetContainer">
    <div class="group-header" id="header-DMP-12">
      <span>DMP-12 (1)</span>
      <div class="lock-status" id="headerLockContainer">
        <!-- Lock icon shown only when locked -->
        <svg class="icon-lock" id="headerLockIcon" viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>
      <!-- Temporary unlock feedback icon from iOS asset -->
      <img src="unlock.jpg" class="lock-feedback-icon" id="headerUnlockFeedback" width="18" height="18" alt="Unlocked" />
    </div>

    <div class="item-row" id="row-MID-21634" data-locked="true" data-serial="MID 21634" data-category="DMP-12">
      <span>MID 21634</span>
      <span class="tick-icon">✓</span>
      <img src="unlock.jpg" class="lock-feedback-icon" id="rowUnlockFeedback" width="18" height="18" alt="Unlocked" />
    </div>
  </div>

  <!-- Action Button -->
  <div class="action-container">
    <button class="btn-complete">COMPLETE</button>
  </div>

  <script>
    // System Data State
    const scannedData = {
      "DMP-12": ["MID 21634"]
    };

    // Format output matching Scanner Bot structure without asterisks
    function generateFormattedCopyText() {
      let output = "Scanned Items\n\n";
      for (const [category, items] of Object.entries(scannedData)) {
        output += `${category}\n`;
        items.forEach(item => {
          output += `• ${item}\n`;
        });
        output += "\n";
      }
      return output.trim();
    }

    // Copy Function with Gray/Green State Transitions
    function executeCopy(btnElement) {
      const textToCopy = generateFormattedCopyText();
      navigator.clipboard.writeText(textToCopy).then(() => {
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.classList.remove('copied');
        }, 1500);
      });
    }

    // Long Press Lock/Unlock Logic (600ms - 650ms threshold)
    const PRESS_DURATION = 625; 
    let pressTimer = null;

    function setupLongPress(element, onLongPress) {
      const start = (e) => {
        pressTimer = setTimeout(() => {
          onLongPress(element);
        }, PRESS_DURATION);
      };

      const cancel = () => {
        if (pressTimer) clearTimeout(pressTimer);
      };

      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('touchend', cancel);
      element.addEventListener('touchmove', cancel);
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', cancel);
      element.addEventListener('mouseleave', cancel);
    }

    // Row Long-Press Handler
    const rowEl = document.getElementById('row-MID-21634');
    setupLongPress(rowEl, (el) => {
      const isLocked = el.getAttribute('data-locked') === 'true';
      if (isLocked) {
        el.setAttribute('data-locked', 'false');
        showUnlockFeedback(document.getElementById('rowUnlockFeedback'));
      } else {
        el.setAttribute('data-locked', 'true');
      }
    });

    // Header Long-Press Handler
    const headerEl = document.getElementById('header-DMP-12');
    const headerLockIcon = document.getElementById('headerLockIcon');
    let isHeaderLocked = true;

    setupLongPress(headerEl, () => {
      isHeaderLocked = !isHeaderLocked;
      if (isHeaderLocked) {
        headerLockIcon.style.display = 'block';
      } else {
        headerLockIcon.style.display = 'none';
        showUnlockFeedback(document.getElementById('headerUnlockFeedback'));
      }
    });

    // Transient Unlock Icon Display
    function showUnlockFeedback(feedbackImg) {
      feedbackImg.classList.add('show');
      setTimeout(() => {
        feedbackImg.classList.remove('show');
      }, 700);
    }

    // Attempted Scan Handling (Duplicate / Locked Data Trigger)
    function simulateScanAttempt(serialNumber) {
      const targetRow = document.getElementById('row-MID-21634');
      const isRowLocked = targetRow.getAttribute('data-locked') === 'true';

      if (isRowLocked || isHeaderLocked) {
        // Auto-scroll instantly to row
        targetRow.scrollIntoView({ behavior: 'instant', block: 'center' });

        // Trigger FaceID-style error shake animation
        targetRow.classList.remove('shake-error');
        void targetRow.offsetWidth; // Trigger reflow
        targetRow.classList.add('shake-error');

        setTimeout(() => {
          targetRow.classList.remove('shake-error');
        }, 500);
      }
    }

    // Global Keypress Trigger for testing duplicate scan ("s" key)
    window.addEventListener('keydown', (e) => {
      if (e.key === 's' || e.key === 'S') {
        simulateScanAttempt('MID 21634');
      }
    });
  </script>
</body>
</html>
